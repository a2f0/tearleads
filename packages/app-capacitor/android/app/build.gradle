apply plugin: 'com.android.application'

android {
    namespace = "com.tearleads.app"
    compileSdk = rootProject.ext.compileSdkVersion
    buildFeatures {
        buildConfig = true
    }
    defaultConfig {
        // Every build type must add a suffix to this non-shippable base ID.
        // Staging inherits release, then overrides its suffix below.
        applicationId = "com.tearleads"
        minSdk = rootProject.ext.minSdkVersion
        targetSdk = rootProject.ext.targetSdkVersion
        versionCode = configuredVersionCode()
        versionName = "1.0"
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
    }
    androidResources {
        ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
    }
    signingConfigs {
        release {
            if (hasReleaseKeystore()) {
                storeFile = releaseKeystoreFile()
                storePassword = System.getenv("ANDROID_KEYSTORE_STORE_PASS")
                keyAlias = "tearleads"
                keyPassword = System.getenv("ANDROID_KEYSTORE_KEY_PASS")
            }
        }
    }
    buildTypes {
        debug {
            applicationIdSuffix = ".app"
        }
        release {
            applicationIdSuffix = ".app"
            signingConfig = hasReleaseKeystore() ? signingConfigs.release : signingConfigs.debug
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            ndk { debugSymbolLevel = 'FULL' }
        }
        staging {
            initWith release
            applicationIdSuffix = ".staging.app"
            matchingFallbacks = ['release']
        }
    }
}

// The release keystore comes from the secrets folder of the tier the native
// release wrappers select with NATIVE_RELEASE_TIER; without one, production.
def releaseKeystoreFile() {
    def tier = (System.getenv("NATIVE_RELEASE_TIER") ?: "production").trim().toLowerCase()
    def secretsTier = [production: "prod", staging: "staging"][tier]
    if (secretsTier == null) {
        throw new GradleException("Unknown NATIVE_RELEASE_TIER '${tier}'. Expected production or staging.")
    }
    return rootProject.file("../../../.secrets/${secretsTier}/tearleads-release.keystore")
}

def hasReleaseKeystore() {
    def keystoreFile = releaseKeystoreFile()
    return keystoreFile.exists() &&
        System.getenv("ANDROID_KEYSTORE_STORE_PASS") != null &&
        System.getenv("ANDROID_KEYSTORE_KEY_PASS") != null
}

def configuredVersionCode() {
    def rawVersionCode = findProperty("tearleadsVersionCode") ?: System.getenv("ANDROID_VERSION_CODE") ?: "1"
    def cleanedVersionCode = rawVersionCode.toString().trim()
    if (!cleanedVersionCode.isInteger()) {
        throw new GradleException("tearleadsVersionCode '${rawVersionCode}' is not a valid integer")
    }

    def versionCode = cleanedVersionCode.toInteger()
    if (versionCode <= 0) {
        throw new GradleException("tearleadsVersionCode must be greater than zero")
    }

    return versionCode
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

def revenueCatExpectedVersions = [
    'purchases': rootProject.ext.revenueCatPurchasesVersion,
    'purchases-hybrid-common': rootProject.ext.revenueCatHybridCommonVersion,
]
configurations.matching { configuration ->
    configuration.name.endsWith('CompileClasspath') ||
        configuration.name.endsWith('RuntimeClasspath')
}.configureEach {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'com.revenuecat.purchases') {
            def expectedVersion = revenueCatExpectedVersions[details.requested.name]
            def requestedVersion = details.requested.version
            if (expectedVersion != null && requestedVersion == null) {
                details.useVersion(expectedVersion)
                details.because(
                    'RevenueCat native bridges share one pinned SDK singleton'
                )
            } else if (expectedVersion != null && requestedVersion != expectedVersion) {
                throw new GradleException(
                    "RevenueCat ${details.requested.name} ${requestedVersion} " +
                    "does not match the pinned ${expectedVersion} in " +
                    "android/variables.gradle"
                )
            }
        }
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:${rootProject.ext.androidxAppCompatVersion}"
    implementation "androidx.coordinatorlayout:coordinatorlayout:${rootProject.ext.androidxCoordinatorLayoutVersion}"
    implementation "androidx.core:core-splashscreen:${rootProject.ext.coreSplashScreenVersion}"
    implementation project(':capacitor-android')
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.11.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0'
    // The first-party purchase bridge imports the native SDK directly. Keep
    // this pin aligned with purchases-hybrid-common from the Capacitor plugin;
    // the resolution guard above pins platform-managed requests and rejects
    // explicit conflicting transitive pins.
    implementation "com.revenuecat.purchases:purchases:${rootProject.ext.revenueCatPurchasesVersion}"
    testImplementation "junit:junit:${rootProject.ext.junitVersion}"
    testImplementation 'org.json:json:20260814'
    androidTestImplementation "androidx.test.ext:junit:${rootProject.ext.androidxJunitVersion}"
    androidTestImplementation "androidx.test.espresso:espresso-core:${rootProject.ext.androidxEspressoCoreVersion}"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

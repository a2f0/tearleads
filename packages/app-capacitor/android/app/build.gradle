apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

android {
    namespace = "com.tearleads.app"
    compileSdk = rootProject.ext.compileSdkVersion
    buildFeatures {
        buildConfig true
    }
    defaultConfig {
        applicationId "com.tearleads.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode configuredVersionCode()
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (hasReleaseKeystore()) {
                storeFile rootProject.file("../../../.secrets/tearleads-release.keystore")
                storePassword System.getenv("ANDROID_KEYSTORE_STORE_PASS")
                keyAlias "tearleads"
                keyPassword System.getenv("ANDROID_KEYSTORE_KEY_PASS")
            }
        }
    }
    buildTypes {
        release {
            signingConfig hasReleaseKeystore() ? signingConfigs.release : signingConfigs.debug
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            ndk { debugSymbolLevel 'FULL' }
        }
        staging {
            initWith release
            applicationIdSuffix ".staging"
            matchingFallbacks = ['release']
            resValue "string", "app_name", "Tearleads Staging"
            resValue "string", "title_activity_main", "Tearleads Staging"
            resValue "string", "package_name", "com.tearleads.app.staging"
            resValue "string", "custom_url_scheme", "com.tearleads.app.staging"
        }
    }
}

def hasReleaseKeystore() {
    def keystoreFile = rootProject.file("../../../.secrets/tearleads-release.keystore")
    return keystoreFile.exists() &&
        System.getenv("ANDROID_KEYSTORE_STORE_PASS") != null &&
        System.getenv("ANDROID_KEYSTORE_KEY_PASS") != null
}

def configuredVersionCode() {
    def rawVersionCode = findProperty("tearleadsVersionCode") ?: System.getenv("ANDROID_VERSION_CODE") ?: "1"
    def cleanedVersionCode = rawVersionCode.toString().trim()
    if (!cleanedVersionCode.isInteger()) {
        throw new GradleException("tearleadsVersionCode '${rawVersionCode}' is not a valid integer")
    }

    def versionCode = cleanedVersionCode.toInteger()
    if (versionCode <= 0) {
        throw new GradleException("tearleadsVersionCode must be greater than zero")
    }

    return versionCode
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.8.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

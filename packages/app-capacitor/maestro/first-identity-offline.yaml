# The FIRST local identity must provision with no backend running.
#
# Key generation is purely local (seed -> key pair -> local SQLite/OPFS), so a
# fresh install must reach a usable, keyed state offline. This is the baseline the
# second-identity test builds on.
#
# Run (iOS simulator):   maestro test packages/app-capacitor/maestro/first-identity-offline.yaml
# Run (Android emulator): same command.
appId: com.tearleads.app
---
# Fresh install with no backend: the app auto-generates the first identity and
# opens the usable Explorer.
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Explorer"
    timeout: 40000

# The Identity Manager shows a keyed, local-only identity — Register/Login are
# available (a key pair exists), not the keyless "Generate Key Pair" state.
- tapOn: "Menu"
- tapOn: "Identity Manager"
- extendedWaitUntil:
    visible: "Register"
    timeout: 20000
- assertVisible: "Local only"
- assertNotVisible: "Generate Key Pair"

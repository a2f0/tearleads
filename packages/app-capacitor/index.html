<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <!-- iOS data detectors otherwise rewrite plain text that merely looks like
         a phone number, date, or address into a live blue underlined link
         inside the WebView — a timestamp column or a contact field turns into a
         link the app never wrote. The anchor rules in @tearleads/ui
         styles.links.css neutralize any that still slip through. -->
    <meta
      name="format-detection"
      content="telephone=no, date=no, address=no, email=no"
    />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="Tearleads mobile app" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Tearleads" />
    <title>Tearleads</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>

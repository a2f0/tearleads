<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover matches the Capacitor shell: it lets the app paint
         edge-to-edge on notched devices and exposes the env(safe-area-inset-*)
         values the chrome pads by (see @tearleads/ui styles.css). -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <!-- Matches the Capacitor shell: iOS Safari runs the same data detectors as
         the WebView, rewriting text that looks like a phone number or date into
         a blue link the app never wrote. See packages/app-capacitor/index.html. -->
    <meta
      name="format-detection"
      content="telephone=no, date=no, address=no, email=no"
    />
    <title>Tearleads – Encrypted notes, contacts, and files</title>
    <meta
      name="description"
      content="Notes, contacts, files, and records, encrypted on your device before they sync. Open Tearleads and start working, with no email or password to set up."
    />
    <!-- Deployments add their tier's canonical or robots tags
         (scripts/injectTierMeta.ts). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Tearleads" />
    <meta
      property="og:title"
      content="Tearleads – Encrypted notes, contacts, and files"
    />
    <meta
      property="og:description"
      content="Notes, contacts, files, and records, encrypted on your device before they sync. Open Tearleads and start working, with no email or password to set up."
    />
    <!-- The website's preview image (packages/website, agent-tool images). -->
    <meta property="og:image" content="https://tearleads.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The Tearleads logo" />
    <meta name="twitter:card" content="summary_large_image" />
    <!--
      Favicon <link> tags are injected into dist/index.html at build time by
      scripts/injectFaviconLinks.ts. They are intentionally not here: Bun's HTML
      bundler tries to resolve root-absolute asset paths and fails the build.
    -->
    <script>
      globalThis.process ??= {};
      globalThis.process.env ??= {};
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>

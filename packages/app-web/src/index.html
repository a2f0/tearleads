<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover matches the Capacitor shell: it lets the app paint
         edge-to-edge on notched devices and exposes the env(safe-area-inset-*)
         values the chrome pads by (see @tearleads/ui styles.css). -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>App</title>
    <!--
      Favicon <link> tags are injected into dist/index.html at build time by
      scripts/buildWebImages.sh. They are intentionally not here: Bun's HTML
      bundler tries to resolve root-absolute asset paths and fails the build.
    -->
    <script>
      globalThis.process ??= {};
      globalThis.process.env ??= {};
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>

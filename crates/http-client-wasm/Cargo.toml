[package]
name = "http-client-wasm"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
http-client = { path = "../http-client" }
protocol = { path = "../protocol", features = ["wasm"] }
store = { path = "../store", features = ["wasm"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

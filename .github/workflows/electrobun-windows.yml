name: Electrobun Windows

on:
  workflow_call:
    inputs:
      force:
        description: Execute checks without reading Turbo cache entries
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      tier:
        description: Release to build (R2 publishing runs locally)
        type: choice
        required: true
        default: both
        options:
          - staging
          - production
          - both

permissions:
  contents: read

env:
  TURBO_FORCE: ${{ inputs.force || github.event_name == 'workflow_dispatch' }}

concurrency:
  group: electrobun-windows-${{ github.run_id }}-${{ github.event_name }}-${{ github.ref }}-${{ inputs.tier }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  persistence:
    name: Windows CEF persistence
    runs-on: windows-2025
    timeout-minutes: 20

    steps:
      - name: Preserve shell script line endings
        run: git config --global core.autocrlf false

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Key the Turbo cache to this runtime
        shell: bash
        run: echo "CI_TOOLCHAIN=bun-$(bun --version)-${RUNNER_OS}-${RUNNER_ARCH}" >> "$GITHUB_ENV"

      - name: Serve the Turbo remote cache from the Actions cache
        uses: rharkor/caching-for-turbo@2238fae6eb9a9936f92356f54cb3660200d105e7 # v2.5.1

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build and reopen CEF with a port conflict
        run: bun scripts/testing/runVerifiedTurbo.ts test:windows-ci

  release:
    name: Windows ${{ matrix.tier }} installer
    if: github.event_name == 'workflow_dispatch' && inputs.tier != ''
    needs: persistence
    runs-on: windows-2025
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        tier: ${{ fromJSON(inputs.tier == 'both' && '["staging","production"]' || format('["{0}"]', inputs.tier)) }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Preserve shell script line endings
        run: git config --global core.autocrlf false

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      # Like the Linux container, build a source archive without .git or upload
      # credentials. Source maps are staged separately for the local publisher.
      - name: Export committed source
        run: |
          release_root="$(cygpath -u "$RUNNER_TEMP")/windows-release"
          mkdir -p "$release_root"
          git archive HEAD | tar -x -C "$release_root"

      - name: Build and verify installer
        env:
          RELEASE_TIER: ${{ matrix.tier }}
          BUILD_GIT_SHA: ${{ github.sha }}
          SENTRY_ELECTROBUN_STAGING_DSN: ${{ vars.SENTRY_ELECTROBUN_STAGING_DSN }}
          SENTRY_ELECTROBUN_PRODUCTION_DSN: ${{ vars.SENTRY_ELECTROBUN_PRODUCTION_DSN }}
        run: |
          cd "$(cygpath -u "$RUNNER_TEMP")/windows-release"
          bun install --frozen-lockfile
          bash packages/app-electrobun/scripts/buildWindowsNative.sh "$RELEASE_TIER"

      - name: Save installer and update artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tearleads-windows-${{ matrix.tier }}-${{ github.sha }}
          path: ${{ runner.temp }}/windows-release/packages/app-electrobun/build/artifacts/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Save source maps for local Sentry upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tearleads-windows-maps-${{ matrix.tier }}-${{ github.sha }}
          path: ${{ runner.temp }}/windows-release/packages/app-electrobun/build/sentry-sourcemaps/
          if-no-files-found: error
          retention-days: 14

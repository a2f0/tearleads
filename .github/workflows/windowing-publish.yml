name: Publish windowing

# Publishes @tearleads/windowing with npm trusted publishing: npm exchanges the
# job's GitHub OIDC token for a short-lived publish token and attaches
# provenance, so no npm token or one-time password is stored anywhere. The
# trusted publisher on npmjs.com names this file and the `npm` environment.
on:
  push:
    branches: [main]
    paths:
      - packages/windowing/**
      - scripts/release/publishNpmPackage.sh
      - scripts/release/npmPublishDecision.ts
      - .github/workflows/windowing-publish.yml
  workflow_dispatch:

permissions: {}

# Publish one version at a time, and never cancel a publish in progress.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish @tearleads/windowing
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Restricted to main in the repository settings, so a workflow edited on
    # another branch cannot obtain a token npm accepts.
    environment: npm
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          version: 2026.10.17
          install_args: bun
          cache: false

      # Trusted publishing needs npm 11.5.1 or later; Node 24.22.1 ships 11.19.1.
      # No registry-url: its .npmrc would point npm at an empty NODE_AUTH_TOKEN.
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          package-manager-cache: false

      # Publish only a version newer than npm's latest, so merges that keep the
      # version, re-runs, and out-of-order runs succeed without publishing.
      - name: Decide whether to publish
        id: decide
        run: bun scripts/release/npmPublishDecision.ts windowing

      - name: Install dependencies
        if: steps.decide.outputs.publish == 'true'
        run: bun install --frozen-lockfile

      - name: Publish to npm
        if: steps.decide.outputs.publish == 'true'
        run: bash scripts/release/publishNpmPackage.sh windowing

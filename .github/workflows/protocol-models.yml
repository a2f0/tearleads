name: Protocol Models

on:
  workflow_call:
    inputs:
      force:
        description: Execute checks without reading Turbo cache entries
        type: boolean
        default: false
  workflow_dispatch:

env:
  TURBO_FORCE: ${{ inputs.force || github.event_name == 'workflow_dispatch' }}

permissions:
  contents: read

concurrency:
  group: protocol-models-${{ github.run_id }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The pure TLC passes run on runners of their own, so a model change (a Turbo
  # miss) costs the longest of these jobs rather than lengthening Lint by all.
  # The models split into three shards by recorded duration
  # (PROTOCOL_MODEL_SHARD), two runs each: four JVMs on one 4 vCPU runner slowed
  # every run by half or more, and past three shards the longest model sets the
  # time. protocolModelShards.test.ts checks that the shards cover the registry,
  # each model exactly once.
  models:
    name: Protocol models (${{ matrix.check }}${{ matrix.shard && format(' {0}', matrix.shard) || '' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { check: check:protocol-models, shard: 1/3, parallelism: 2 }
          - { check: check:protocol-models, shard: 2/3, parallelism: 2 }
          - { check: check:protocol-models, shard: 3/3, parallelism: 2 }
          - { check: check:protocol-negative-controls, shard: "", parallelism: 4 }

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up model tooling
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: 2026.11.8
          install_args: bun java github:tlaplus/tlaplus
          cache: true

      - name: Key the Turbo cache to this runtime
        run: echo "CI_TOOLCHAIN=bun-$(bun --version)-${RUNNER_OS}-${RUNNER_ARCH}" >> "$GITHUB_ENV"

      - name: Serve the Turbo remote cache from the Actions cache
        uses: rharkor/caching-for-turbo@760158c05c47e7a764f78e9a22ca3b5a6ed8c52e # v2.5.2
        with:
          server-port: 0

      - name: Install dependencies
        run: sh scripts/lib/installDependencies.sh

      - name: Run model check
        env:
          CI_TURBO_PROTOCOL_CACHE: "1"
          MODEL_CHECK: ${{ matrix.check }}
          PROTOCOL_MODEL_SHARD: ${{ matrix.shard }}
          PROTOCOL_TLC_FAILURE_LOG_DIR: ${{ runner.temp }}/tlc-failures
          PROTOCOL_TLC_PARALLELISM: ${{ matrix.parallelism }}
        run: bun scripts/checks/runCachedProtocolCheck.ts "$MODEL_CHECK"

      # A failing model's full TLC log, which the job's stdout can cut short.
      - name: Upload failing TLC logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tlc-failure-logs-${{ strategy.job-index }}
          path: ${{ runner.temp }}/tlc-failures
          if-no-files-found: ignore

name: iOS Purchase Bridge

on:
  pull_request:
    paths:
      - ".github/workflows/ios-purchase-bridge.yml"
      - "bun.lock"
      - "package.json"
      - "packages/app-capacitor/**"
      - "packages/app/src/mini-apps/org-manager/billing/**"
      - "packages/app/src/mini-apps/org-manager/hooks/useBillingActions*"
      - "packages/app/src/mini-apps/org-manager/hooks/useBillingOptions*"
      - "packages/app/src/mini-apps/org-manager/hooks/useResolvedBillingOptions*"
      - "packages/app/src/mini-apps/org-manager/labels.ts"
      - "packages/app/src/providers/purchases/**"
      - "packages/client-sdk/src/client/purchase*"
      - "packages/client-sdk/src/client/revenueCat*"
      - "packages/validators/src/billing/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    name: iOS purchase bridge
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Capacitor web assets
        working-directory: packages/app-capacitor
        env:
          VITE_API_BASE_URL: https://api.tearleads.de
        run: bun run build

      - name: Synchronize iOS project
        working-directory: packages/app-capacitor
        env:
          CAPACITOR_BUILD_CONFIGURATION: Release-Staging
          NATIVE_RELEASE_TIER: staging
        run: bunx cap sync ios

      - name: Compile iOS purchase bridge
        working-directory: packages/app-capacitor
        run: |
          xcodebuild \
            -quiet \
            -project ios/App/App.xcodeproj \
            -scheme App-Staging \
            -configuration Release-Staging \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

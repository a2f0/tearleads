name: Native Purchase Bridges

on:
  workflow_call:
    inputs:
      force:
        description: Execute checks without reading Turbo cache entries
        type: boolean
        default: false
  workflow_dispatch:

env:
  TURBO_FORCE: ${{ inputs.force || github.event_name == 'workflow_dispatch' }}

permissions:
  contents: read

concurrency:
  group: native-purchase-bridges-${{ github.run_id }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  android:
    name: Android purchase bridge
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Android build tooling
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          version: 2026.10.17
          install_args: bun java gradle
          cache: true

      - name: Key the Turbo cache to this runtime
        run: echo "CI_TOOLCHAIN=bun-$(bun --version)-${RUNNER_OS}-${RUNNER_ARCH}" >> "$GITHUB_ENV"

      - name: Serve the Turbo remote cache from the Actions cache
        uses: rharkor/caching-for-turbo@760158c05c47e7a764f78e9a22ca3b5a6ed8c52e # v2.5.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Compile and test Android purchase bridge
        run: bun scripts/testing/runVerifiedTurbo.ts test:native-android-ci

  ios:
    name: iOS purchase bridge
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          version: 2026.10.17
          install_args: bun
          cache: true

      - name: Key the Turbo cache to this runtime
        run: echo "CI_TOOLCHAIN=bun-$(bun --version)-${RUNNER_OS}-${RUNNER_ARCH}" >> "$GITHUB_ENV"

      - name: Serve the Turbo remote cache from the Actions cache
        uses: rharkor/caching-for-turbo@760158c05c47e7a764f78e9a22ca3b5a6ed8c52e # v2.5.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Compile iOS purchase bridge
        run: bun scripts/testing/runVerifiedTurbo.ts test:native-ios-ci

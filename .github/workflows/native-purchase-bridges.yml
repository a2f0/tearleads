name: Native Purchase Bridges

on:
  pull_request:
    paths:
      - ".github/workflows/native-purchase-bridges.yml"
      - "bun.lock"
      - "package.json"
      - "packages/app-capacitor/android/**"
      - "packages/app-capacitor/capacitor.config.ts"
      - "packages/app-capacitor/ios/**"
      - "packages/app-capacitor/package.json"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/native-purchase-bridges.yml"
      - "bun.lock"
      - "package.json"
      - "packages/app-capacitor/android/**"
      - "packages/app-capacitor/capacitor.config.ts"
      - "packages/app-capacitor/ios/**"
      - "packages/app-capacitor/package.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  android:
    name: Android purchase bridge
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Android build tooling
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.1
          install_args: java gradle
          cache: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build workspace packages
        run: bun run build:packages

      - name: Build Capacitor web assets
        working-directory: packages/app-capacitor
        env:
          VITE_API_BASE_URL: https://api-staging.tearleads.com
        run: bun run build

      - name: Synchronize Android project
        working-directory: packages/app-capacitor
        env:
          CAPACITOR_BUILD_CONFIGURATION: Release-Staging
          NATIVE_RELEASE_TIER: staging
        run: bunx cap sync android

      - name: Compile and test Android purchase bridge
        working-directory: packages/app-capacitor/android
        run: gradle :app:compileDebugKotlin :app:testDebugUnitTest --no-daemon

  ios:
    name: iOS purchase bridge
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build workspace packages
        run: bun run build:packages

      - name: Build Capacitor web assets
        working-directory: packages/app-capacitor
        env:
          VITE_API_BASE_URL: https://api-staging.tearleads.com
        run: bun run build

      - name: Synchronize iOS project
        working-directory: packages/app-capacitor
        env:
          CAPACITOR_BUILD_CONFIGURATION: Release-Staging
          NATIVE_RELEASE_TIER: staging
        run: bunx cap sync ios

      - name: Test iOS prepared-package state
        working-directory: packages/app-capacitor
        run: swift test --package-path ios/App/RevenueCatPurchaseState

      - name: Compile iOS purchase bridge
        working-directory: packages/app-capacitor
        run: |
          xcodebuild \
            -quiet \
            -project ios/App/App.xcodeproj \
            -scheme App-Staging \
            -configuration Release-Staging \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

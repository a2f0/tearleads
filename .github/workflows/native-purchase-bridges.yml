name: Native Purchase Bridges

on:
  workflow_call:
    inputs:
      force:
        description: Execute checks without reading Turbo cache entries
        type: boolean
        default: false
  workflow_dispatch:

env:
  TURBO_FORCE: ${{ inputs.force || github.event_name == 'workflow_dispatch' }}

permissions:
  contents: read

concurrency:
  group: native-purchase-bridges-${{ github.run_id }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  android:
    name: Android purchase bridge
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Android build tooling
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: 2026.11.8
          install_args: bun java gradle
          cache: true

      - name: Key the Turbo cache to this runtime
        run: echo "CI_TOOLCHAIN=bun-$(bun --version)-${RUNNER_OS}-${RUNNER_ARCH}" >> "$GITHUB_ENV"

      - name: Serve the Turbo remote cache from the Actions cache
        uses: rharkor/caching-for-turbo@760158c05c47e7a764f78e9a22ca3b5a6ed8c52e # v2.5.2
        with:
          # A fixed port can already be held by an earlier step's socket.
          server-port: 0

      # Gradle resolves AGP, Kotlin and plugin artifacts from Google Maven and
      # Maven Central on every cold run; a registry blip then fails the lane.
      # Reuse resolved modules so a warm run needs no repository round trip.
      # The key follows the tracked Gradle files (cap sync records the plugin
      # set there) and toolchain pins, not bun.lock, which every release bumps.
      - name: Cache Gradle dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches/modules-2
            !~/.gradle/caches/modules-2/*.lock
            !~/.gradle/caches/modules-2/gc.properties
          key: gradle-modules-${{ runner.os }}-${{ hashFiles('packages/app-capacitor/android/**/*.gradle', 'packages/app-capacitor/android/gradle/wrapper/gradle-wrapper.properties', '.mise.toml') }}
          restore-keys: gradle-modules-${{ runner.os }}-

      - name: Install dependencies
        run: sh scripts/lib/installDependencies.sh

      - name: Compile and test Android purchase bridge
        run: bun scripts/testing/runVerifiedTurbo.ts test:native-android-ci

  ios:
    name: iOS purchase bridge
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: 2026.11.8
          install_args: bun
          cache: true

      - name: Key the Turbo cache to this runtime
        run: echo "CI_TOOLCHAIN=bun-$(bun --version)-${RUNNER_OS}-${RUNNER_ARCH}" >> "$GITHUB_ENV"

      - name: Serve the Turbo remote cache from the Actions cache
        uses: rharkor/caching-for-turbo@760158c05c47e7a764f78e9a22ca3b5a6ed8c52e # v2.5.2
        with:
          server-port: 0

      - name: Install dependencies
        run: sh scripts/lib/installDependencies.sh

      # Xcode's build state (Swift package checkouts and the dependency
      # compiles) helps only when Turbo runs the compile; a replayed pass reads
      # none of it, so the restore waits on Turbo's cache lookup. Xcode records
      # absolute paths and compiler identity, so the key pins the checkout, the
      # state directory, and the Xcode build next to the package pins, and
      # allows no partial match. Checked-out sources always look modified to
      # Xcode, so they recompile after every restore.
      - name: Plan the iOS compile
        id: plan
        shell: bash
        run: |
          build_root="$RUNNER_TEMP/native-ios"
          echo "NATIVE_IOS_BUILD_ROOT=$build_root" >> "$GITHUB_ENV"
          status=$(node_modules/.bin/turbo run test:native-ios-ci --dry-run=json \
            | jq -r '.tasks[] | select(.taskId == "//#test:native-ios-ci") | .cache.status')
          echo "Turbo cache status: $status"
          if [ "$TURBO_FORCE" = true ] || [ "$status" != HIT ]; then
            echo "compile=true" >> "$GITHUB_OUTPUT"
          fi
          xcodebuild -version
          identity=$({ xcodebuild -version; echo "$GITHUB_WORKSPACE"; echo "$build_root"; } | shasum -a 256 | cut -c 1-16)
          echo "identity=$identity" >> "$GITHUB_OUTPUT"

      - name: Restore Xcode build state
        id: restore-build-state
        if: steps.plan.outputs.compile == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.NATIVE_IOS_BUILD_ROOT }}
          key: native-ios-build-${{ runner.os }}-${{ runner.arch }}-${{ steps.plan.outputs.identity }}-${{ hashFiles('packages/app-capacitor/ios/App/App.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'packages/app-capacitor/ios/App/*/Package.swift') }}

      # A restored file keeps its size and modification time but gets a new
      # inode, which Xcode's build system compares by default.
      - name: Let Xcode reuse the restored state
        if: steps.restore-build-state.outputs.cache-hit == 'true'
        run: |
          defaults write com.apple.dt.XCBuild IgnoreFileSystemDeviceInodeChanges -bool YES
          find "$NATIVE_IOS_BUILD_ROOT/DerivedData/SourcePackages/checkouts" -name '*.swift' | head -n 3 | xargs stat -f '%Fm %N'
          touch "$RUNNER_TEMP/native-ios-restored"

      - name: Compile iOS purchase bridge
        run: bun scripts/testing/runVerifiedTurbo.ts test:native-ios-ci

      - name: Report Xcode build reuse
        if: steps.restore-build-state.outputs.cache-hit == 'true'
        run: |
          objects="$NATIVE_IOS_BUILD_ROOT/DerivedData/Build/Intermediates.noindex"
          echo "Object files rebuilt after the restore, by target:"
          find "$objects" -name '*.o' -newer "$RUNNER_TEMP/native-ios-restored" \
            | sed -E 's#^.*/Intermediates.noindex/([^/]+)\.build/.*#\1#' | sort | uniq -c
          echo "Object files in total: $(find "$objects" -name '*.o' | wc -l)"

      # Pull requests read the state main saves but never write their own, so
      # one entry per key stays in the shared Actions cache.
      - name: Save Xcode build state
        if: steps.plan.outputs.compile == 'true' && steps.restore-build-state.outputs.cache-hit != 'true' && github.event_name != 'pull_request'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.NATIVE_IOS_BUILD_ROOT }}
          key: ${{ steps.restore-build-state.outputs.cache-primary-key }}

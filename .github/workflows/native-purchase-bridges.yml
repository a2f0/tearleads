name: Native Purchase Bridges

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android purchase bridge
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Android build tooling
        uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4.2.1
        with:
          version: 2026.6.12
          install_args: java gradle
          cache: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Compile and test Android purchase bridge
        working-directory: packages/app-capacitor/android
        run: mise exec -- gradle :app:compileDebugKotlin :app:testDebugUnitTest --no-daemon

  ios:
    name: iOS purchase bridge
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.0"
          bundler-cache: true
          working-directory: packages/app-capacitor

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build workspace packages
        run: bun run build:packages

      - name: Build Capacitor web assets
        working-directory: packages/app-capacitor
        env:
          VITE_API_BASE_URL: https://api.tearleads.de
        run: bun run build

      - name: Synchronize iOS project
        working-directory: packages/app-capacitor
        env:
          CAPACITOR_BUILD_CONFIGURATION: Release-Staging
          NATIVE_RELEASE_TIER: staging
        run: bunx cap sync ios

      - name: Compile iOS purchase bridge
        working-directory: packages/app-capacitor
        run: |
          xcodebuild \
            -quiet \
            -project ios/App/App.xcodeproj \
            -scheme App-Staging \
            -configuration Release-Staging \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

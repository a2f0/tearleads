name: Uncached tests

# Exercise the same CI lanes without cache reads, including model checks and
# native/Windows/Postgres probes, so omitted Turbo inputs cannot hide failures.
on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: uncached-tests
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
    with:
      force: true

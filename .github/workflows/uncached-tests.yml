name: Uncached tests

# CI replays a cached pass whenever a task's declared inputs match an earlier
# run. This run reads no cache, so a test that depends on a file its turbo.json
# does not declare fails here while CI keeps replaying the stale pass.
on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: uncached-tests
  cancel-in-progress: false

jobs:
  test:
    name: Uncached tests
    runs-on: ubuntu-latest
    # Two Turbo slots run the API, app, and client SDK suites back to back.
    timeout-minutes: 75
    env:
      TURBO_FORCE: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Set up Ruby
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: "4.0.7"
          bundler-cache: true
          working-directory: packages/app-capacitor

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build workspace packages
        run: bun run build:packages

      - name: Run every test without the cache
        run: bun run test:turbo:bun

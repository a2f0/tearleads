name: Publish client SDK

# Publishes @tearleads/client-sdk with npm trusted publishing: npm exchanges the
# job's GitHub OIDC token for a short-lived publish token and attaches
# provenance, so no npm token or one-time password is stored anywhere. The
# trusted publisher on npmjs.com names this file and the `npm` environment.
#
# The package ships the workspace packages the SDK imports, compiled inside it.
# agent-tool.json lists the SDK under versions.bundles, so a change to any of
# them also bumps packages/client-sdk/package.json, which this filter covers.
on:
  push:
    branches: [main]
    paths:
      - packages/client-sdk/**
      - scripts/publishNpmPackage.sh
      - scripts/lib/npmPublishDecision.ts
      - scripts/lib/rewriteDistImports.ts
      - .github/workflows/client-sdk-publish.yml
  workflow_dispatch:

permissions: {}

# Publish one version at a time, and never cancel a publish in progress.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish @tearleads/client-sdk
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Restricted to main in the repository settings, so a workflow edited on
    # another branch cannot obtain a token npm accepts.
    environment: npm
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      # Trusted publishing needs npm 11.5.1 or later; Node 24.21.0 ships 11.19.0.
      # No registry-url: its .npmrc would point npm at an empty NODE_AUTH_TOKEN.
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          package-manager-cache: false

      # Publish only a version newer than npm's latest, so merges that keep the
      # version, re-runs, and out-of-order runs succeed without publishing.
      - name: Decide whether to publish
        id: decide
        run: bun scripts/lib/npmPublishDecision.ts client-sdk

      - name: Install dependencies
        if: steps.decide.outputs.publish == 'true'
        run: bun install --frozen-lockfile

      # Installs the packed package outside the workspace and imports,
      # typechecks, and bundles it before anything reaches npm.
      - name: Smoke test the package
        if: steps.decide.outputs.publish == 'true'
        run: bun run --cwd packages/client-sdk package:smoke

      - name: Publish to npm
        if: steps.decide.outputs.publish == 'true'
        run: bash scripts/publishNpmPackage.sh client-sdk

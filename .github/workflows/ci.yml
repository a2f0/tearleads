name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      force:
        description: Execute checks without reading Turbo cache entries
        type: boolean
        default: false

env:
  TURBO_FORCE: ${{ inputs.force || github.event_name == 'workflow_dispatch' }}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect required checks
    runs-on: ubuntu-latest
    outputs:
      native: ${{ steps.scopes.outputs.native }}
      proofs: ${{ steps.scopes.outputs.proofs }}
      terraform: ${{ steps.scopes.outputs.terraform }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Bun
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: 2026.11.0
          install_args: bun
          cache: true
      - name: Determine platform checks
        id: scopes
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bun scripts/checks/ciChanges.ts

  windows:
    uses: ./.github/workflows/electrobun-windows.yml
    with:
      force: ${{ inputs.force || github.event_name == 'workflow_dispatch' }}

  native:
    needs: changes
    if: needs.changes.outputs.native == 'true'
    uses: ./.github/workflows/native-purchase-bridges.yml
    with:
      force: ${{ inputs.force || github.event_name == 'workflow_dispatch' }}

  gate:
    name: CI gate
    if: always()
    needs: [changes, lint, build, test, postgres-concurrency, windows, native, proofs, terraform]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Bun
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: 2026.11.0
          install_args: bun
          cache: true
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Require every applicable check to succeed
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: printf '%s\n' "$CI_NEEDS" | bun run agent-tool ci gate - --policy scripts/checks/ciGate.json

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up lint tooling
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: 2026.11.0
          install_args: bun java shellcheck github:oasdiff/oasdiff github:tlaplus/tlaplus
          cache: true

      # turbo.json hashes CI_TOOLCHAIN; Turbo does not hash the runtime itself.
      - name: Key the Turbo cache to this runtime
        run: echo "CI_TOOLCHAIN=bun-$(bun --version)-${RUNNER_OS}-${RUNNER_ARCH}" >> "$GITHUB_ENV"

      - name: Serve the Turbo remote cache from the Actions cache
        uses: rharkor/caching-for-turbo@760158c05c47e7a764f78e9a22ca3b5a6ed8c52e # v2.5.2

      - name: Set up Ruby
        uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
        with:
          ruby-version: "4.0.9"
          bundler-cache: true
          working-directory: packages/app-capacitor

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Pre-push lints a pushed branch only where hooks are installed, so a
      # pull request opened from any other clone is checked here. The name is
      # untrusted input: it reaches the shell only through the environment.
      # Pass a ref tuple on stdin so option-like names stay data even when Bun
      # would drop an argument named `--`.
      - name: Check branch name
        if: github.event_name == 'pull_request'
        env:
          BRANCH_NAME: ${{ github.head_ref }}
        run: |
          printf 'HEAD %s refs/heads/%s %040d\n' "$GITHUB_SHA" "$BRANCH_NAME" 0 |
            bun run agent-tool branch check --pre-push

      - name: Run lint checks
        env:
          CI_TURBO_PROTOCOL_CACHE: "1"
          OPENAPI_BASE_REF: ${{ github.event.pull_request.base.sha || (github.event.before != '0000000000000000000000000000000000000000' && github.event.before) || '' }}
          PROTOCOL_TLC_FAILURE_LOG_DIR: ${{ runner.temp }}/tlc-failures
        run: bun run check:fast

      # A failing model's full TLC log, which the job's stdout can cut short.
      - name: Upload failing TLC logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tlc-failure-logs
          path: ${{ runner.temp }}/tlc-failures
          if-no-files-found: ignore

      - name: Run native release checks
        env:
          FASTLANE_OPT_OUT_USAGE: "1"
          FASTLANE_SKIP_UPDATE_CHECK: "1"
        run: bun scripts/testing/runVerifiedTurbo.ts test --filter=app-capacitor

  # The suites too long to share a runner run in `test`; this job keeps the
  # remaining package tests alongside the TypeScript and web builds.
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: 2026.11.0
          install_args: bun
          cache: true

      # Astro's executable uses Node even when Bun starts the package tests.
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.2
          package-manager-cache: false

      - name: Key the Turbo cache to this runtime
        run: echo "CI_TOOLCHAIN=bun-$(bun --version)-node-$(node --version)-${RUNNER_OS}-${RUNNER_ARCH}" >> "$GITHUB_ENV"

      - name: Serve the Turbo remote cache from the Actions cache
        uses: rharkor/caching-for-turbo@760158c05c47e7a764f78e9a22ca3b5a6ed8c52e # v2.5.2

      - name: Set up Ruby
        uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
        with:
          ruby-version: "4.0.9"
          bundler-cache: true
          working-directory: packages/app-capacitor

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build workspace packages
        run: bun run build:packages

      - name: Check TypeScript
        run: bun tsc --build --pretty false

      - name: Run tests
        run: >-
          bun scripts/testing/runVerifiedTurbo.ts test
          --filter='!@tearleads/api' --filter='!app' --filter='!@tearleads/client-sdk'
          --filter='!@tearleads/bob-and-alice'

      - name: Build web application
        run: bun run --cwd packages/app-web build

  # One runner per long suite: sharing two Turbo slots serialized them into a
  # 40-55 minute job. The API and app suites split further into Bun shards (and
  # the API into one backend per runner) so no shard holds the critical path.
  # Each API shard keeps the default two workers: four PGlite workers on one
  # runner pushed a near-limit test past Bun's 5 s timeout.
  # Turbo hashes the passed arguments, so each shard whose inputs match an
  # earlier run on this branch or main replays from the cache instead of
  # running.
  test:
    name: Test (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: api memory 1/3
            filter: "@tearleads/api"
            args: --database=memory --shard=1/3
          - suite: api memory 2/3
            filter: "@tearleads/api"
            args: --database=memory --shard=2/3
          - suite: api memory 3/3
            filter: "@tearleads/api"
            args: --database=memory --shard=3/3
          - suite: api sqlite 1/3
            filter: "@tearleads/api"
            args: --database=sqlite --shard=1/3
          - suite: api sqlite 2/3
            filter: "@tearleads/api"
            args: --database=sqlite --shard=2/3
          - suite: api sqlite 3/3
            filter: "@tearleads/api"
            args: --database=sqlite --shard=3/3
          - suite: app 1/2
            filter: app
            args: --shard=1/2
          - suite: app 2/2
            filter: app
            args: --shard=2/2
          - suite: client-sdk
            filter: "@tearleads/client-sdk"
            args: ""
          - suite: bob-and-alice
            filter: "@tearleads/bob-and-alice"
            args: ""

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: 2026.11.0
          install_args: bun
          cache: true

      - name: Key the Turbo cache to this runtime
        run: echo "CI_TOOLCHAIN=bun-$(bun --version)-${RUNNER_OS}-${RUNNER_ARCH}" >> "$GITHUB_ENV"

      - name: Serve the Turbo remote cache from the Actions cache
        uses: rharkor/caching-for-turbo@760158c05c47e7a764f78e9a22ca3b5a6ed8c52e # v2.5.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # SUITE_ARGS is a fixed matrix value: split on spaces, it reaches the
      # package's test script after Turbo's `--`.
      - name: Run tests
        env:
          SUITE_FILTER: ${{ matrix.filter }}
          SUITE_ARGS: ${{ matrix.args }}
        run: |
          if [ -n "$SUITE_ARGS" ]; then
            # shellcheck disable=SC2086
            bun scripts/testing/runVerifiedTurbo.ts test "--filter=$SUITE_FILTER" -- $SUITE_ARGS
          else
            bun scripts/testing/runVerifiedTurbo.ts test "--filter=$SUITE_FILTER"
          fi

  postgres-concurrency:
    name: Postgres concurrency
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: tearleads
          POSTGRES_PASSWORD: tearleads
          POSTGRES_DB: tearleads_concurrency_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tearleads"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: 2026.11.0
          install_args: bun
          cache: true

      - name: Key the Turbo cache to this runtime
        run: echo "CI_TOOLCHAIN=bun-$(bun --version)-${RUNNER_OS}-${RUNNER_ARCH}" >> "$GITHUB_ENV"

      - name: Serve the Turbo remote cache from the Actions cache
        uses: rharkor/caching-for-turbo@760158c05c47e7a764f78e9a22ca3b5a6ed8c52e # v2.5.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Postgres concurrency lane
        env:
          CI_POSTGRES_IMAGE: postgres:18.6
          DATABASE_URL: postgres://tearleads:tearleads@localhost:5432/tearleads_concurrency_test
        run: bun scripts/testing/runVerifiedTurbo.ts test:postgres-concurrency

  # The Lean toolchain is a multi-gigabyte install, so the proofs build only
  # when the Lean package or its tooling changes. The committed vectors are
  # replayed through the TypeScript verifiers by check:fast on every change.
  proofs:
    name: Lean proofs
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.proofs == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Lean tooling
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: 2026.11.0
          install_args: bun github:leanprover/lean4
          cache: true

      - name: Build the proofs and check the vector fixture
        run: bun run check:protocol-proofs

  terraform:
    name: Terraform lint
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.terraform == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Terraform tooling
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: 2026.11.0
          install_args: terraform tflint
          cache: true

      - name: Init TFLint plugins
        run: tflint --init

      - name: Lint Terraform
        run: ./scripts/checks/checkTerraform.sh

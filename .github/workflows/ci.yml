name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect required checks
    runs-on: ubuntu-latest
    outputs:
      native: ${{ steps.scopes.outputs.native }}
      terraform: ${{ steps.scopes.outputs.terraform }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - name: Determine platform checks
        id: scopes
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bun scripts/checks/ciChanges.ts

  windows:
    uses: ./.github/workflows/electrobun-windows.yml

  native:
    needs: changes
    if: needs.changes.outputs.native == 'true'
    uses: ./.github/workflows/native-purchase-bridges.yml

  gate:
    name: CI gate
    if: always()
    needs: [changes, lint, build, test, postgres-concurrency, windows, native, terraform]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - name: Require every applicable check to succeed
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: bun scripts/checks/ciGate.ts

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up lint tooling
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: 2026.10.3
          install_args: java shellcheck github:oasdiff/oasdiff github:tlaplus/tlaplus pipx:ansible-core
          cache: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      # turbo.json hashes CI_TOOLCHAIN; Turbo does not hash the runtime itself.
      - name: Key the Turbo cache to this runtime
        run: echo "CI_TOOLCHAIN=bun-$(bun --version)-${RUNNER_OS}-${RUNNER_ARCH}" >> "$GITHUB_ENV"

      - name: Serve the Turbo remote cache from the Actions cache
        uses: rharkor/caching-for-turbo@2238fae6eb9a9936f92356f54cb3660200d105e7 # v2.5.1

      - name: Set up Ruby
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: "4.0.7"
          bundler-cache: true
          working-directory: packages/app-capacitor

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run lint checks
        env:
          OPENAPI_BASE_REF: ${{ github.event.pull_request.base.sha || (github.event.before != '0000000000000000000000000000000000000000' && github.event.before) || '' }}
          PROTOCOL_TLC_FAILURE_LOG_DIR: ${{ runner.temp }}/tlc-failures
        run: bun run check:fast

      # A failing model's full TLC log, which the job's stdout can cut short.
      - name: Upload failing TLC logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tlc-failure-logs
          path: ${{ runner.temp }}/tlc-failures
          if-no-files-found: ignore

      - name: Run native release checks
        env:
          FASTLANE_OPT_OUT_USAGE: "1"
          FASTLANE_SKIP_UPDATE_CHECK: "1"
        run: bun run build:packages && bun run --cwd packages/app-capacitor test

  # The suites too long to share a runner run in `test`; this job keeps the
  # remaining package tests alongside the TypeScript and web builds.
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Key the Turbo cache to this runtime
        run: echo "CI_TOOLCHAIN=bun-$(bun --version)-${RUNNER_OS}-${RUNNER_ARCH}" >> "$GITHUB_ENV"

      - name: Serve the Turbo remote cache from the Actions cache
        uses: rharkor/caching-for-turbo@2238fae6eb9a9936f92356f54cb3660200d105e7 # v2.5.1

      - name: Set up Ruby
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: "4.0.7"
          bundler-cache: true
          working-directory: packages/app-capacitor

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build workspace packages
        run: bun run build:packages

      - name: Check TypeScript
        run: bun tsc --build --pretty false

      - name: Run tests
        run: >-
          bun scripts/testing/runVerifiedTurbo.ts test
          --filter='!@tearleads/api' --filter='!app' --filter='!@tearleads/client-sdk'

      - name: Build web application
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          bun run --cwd packages/app-web build

  # One runner per long suite: sharing two Turbo slots serialized them into a
  # 40-55 minute job. A suite whose inputs match an earlier run on this branch
  # or main replays from the cache instead of running.
  test:
    name: Test (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: api
            filter: "@tearleads/api"
          - suite: app
            filter: app
          - suite: client-sdk
            filter: "@tearleads/client-sdk"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Key the Turbo cache to this runtime
        run: echo "CI_TOOLCHAIN=bun-$(bun --version)-${RUNNER_OS}-${RUNNER_ARCH}" >> "$GITHUB_ENV"

      - name: Serve the Turbo remote cache from the Actions cache
        uses: rharkor/caching-for-turbo@2238fae6eb9a9936f92356f54cb3660200d105e7 # v2.5.1

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        env:
          SUITE_FILTER: ${{ matrix.filter }}
        run: bun scripts/testing/runVerifiedTurbo.ts test "--filter=$SUITE_FILTER"

  postgres-concurrency:
    name: Postgres concurrency
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: tearleads
          POSTGRES_PASSWORD: tearleads
          POSTGRES_DB: tearleads_concurrency_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tearleads"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Key the Turbo cache to this runtime
        run: echo "CI_TOOLCHAIN=bun-$(bun --version)-${RUNNER_OS}-${RUNNER_ARCH}" >> "$GITHUB_ENV"

      - name: Serve the Turbo remote cache from the Actions cache
        uses: rharkor/caching-for-turbo@2238fae6eb9a9936f92356f54cb3660200d105e7 # v2.5.1

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build workspace packages
        run: bun run build:packages

      - name: Run Postgres concurrency lane
        env:
          DATABASE_URL: postgres://tearleads:tearleads@localhost:5432/tearleads_concurrency_test
        run: bun run test:postgres-concurrency

  terraform:
    name: Terraform lint
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.terraform == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Ansible for deployment checks
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: 2026.10.3
          install_args: pipx:ansible-core
          cache: true

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.1
          terraform_wrapper: false

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: v0.64.0

      - name: Init TFLint plugins
        run: tflint --init

      - name: Lint Terraform
        run: ./scripts/checks/checkTerraform.sh

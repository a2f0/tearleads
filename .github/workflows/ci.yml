name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# TEMPORARY: broad build and Terraform jobs remain manually dispatched to
# conserve Actions credits. Lint stays automatic, as do the path-scoped native
# purchase bridge compiles because those first-party bridges have no fallback.

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up lint tooling
        uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4.2.1
        with:
          version: 2026.6.12
          install_args: java shellcheck github:oasdiff/oasdiff github:tlaplus/tlaplus
          cache: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.0"
          bundler-cache: true
          working-directory: packages/app-capacitor

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run lint checks
        env:
          OPENAPI_BASE_REF: ${{ github.event.pull_request.base.sha || (github.event.before != '0000000000000000000000000000000000000000' && github.event.before) || '' }}
        run: bun run check:fast

      - name: Run native release checks
        env:
          FASTLANE_OPT_OUT_USAGE: "1"
          FASTLANE_SKIP_UPDATE_CHECK: "1"
        run: bun run build:packages && bun run --cwd packages/app-capacitor test

  build:
    name: Build and test
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.0"
          bundler-cache: true
          working-directory: packages/app-capacitor

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun run test:bun

  postgres-concurrency:
    name: Postgres concurrency
    runs-on: ubuntu-latest
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          github.event_name == 'pull_request' ||
          github.ref == 'refs/heads/main' }}
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: symcrypt
          POSTGRES_PASSWORD: symcrypt
          POSTGRES_DB: symcrypt_concurrency_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U symcrypt"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build workspace packages
        run: bun run build:packages

      - name: Run Postgres concurrency lane
        env:
          DATABASE_URL: postgres://symcrypt:symcrypt@localhost:5432/symcrypt_concurrency_test
        run: bun run test:postgres-concurrency

  terraform:
    name: Terraform lint
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v6

      - name: Init TFLint plugins
        run: tflint --init

      - name: Lint Terraform
        run: ./scripts/checks/checkTerraform.sh

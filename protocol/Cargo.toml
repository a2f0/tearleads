[package]
name = "protocol"
version = "0.1.0"
edition = "2024"

[features]
wasm = ["tsify-next", "wasm-bindgen"]

[dependencies]
serde = { version = "1", features = ["derive"] }
tsify-next = { version = "0.5", optional = true, default-features = false, features = ["js"] }
wasm-bindgen = { version = "0.2", optional = true }

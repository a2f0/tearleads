ls:
  .dir: regex:[A-Za-z0-9][A-Za-z0-9-]*
  .*: regex:[A-Za-z0-9][A-Za-z0-9._-]* | regex:README | regex:Cargo

  # `exists` budgets one suffix-depth cohort at a time. Path-specific blocks
  # override global rules, so each cohort repeats the filename check.
  packages/app/src/mini-apps/explorer:
    .*: regex:[A-Za-z0-9][A-Za-z0-9._-]* | exists:0-9
    .*.*: regex:[A-Za-z0-9][A-Za-z0-9._-]* | exists:0-6
    .*.*.*: regex:[A-Za-z0-9][A-Za-z0-9._-]* | exists:0-3

  packages/app/src/mini-apps/explorer/*:
    .dir: regex:(context-menu|detail|hooks|modal|model|purge-progress|shared|sidebar|toolbar)
    .*: regex:[A-Za-z0-9][A-Za-z0-9._-]* | exists:0-33
    .*.*: regex:[A-Za-z0-9][A-Za-z0-9._-]* | exists:0-16
    .*.*.*: regex:[A-Za-z0-9][A-Za-z0-9._-]* | exists:0-3

  packages/app/src/mini-apps/explorer/detail:
    .*: regex:[A-Za-z0-9][A-Za-z0-9._-]* | exists:0-15
    .*.*: regex:[A-Za-z0-9][A-Za-z0-9._-]* | exists:0-6
    .*.*.*: regex:[A-Za-z0-9][A-Za-z0-9._-]* | exists:0-3

  packages/app/src/mini-apps/explorer/detail/*:
    .dir: regex:(blob|container|document|sync)
    .*: regex:[A-Za-z0-9][A-Za-z0-9._-]* | exists:0-16
    .*.*: regex:[A-Za-z0-9][A-Za-z0-9._-]* | exists:0-6
    .*.*.*: regex:[A-Za-z0-9][A-Za-z0-9._-]* | exists:0-3

  packages/app/src/mini-apps/explorer/detail/*/*:
    .dir: exists:0

  # detail/* keeps its four subject dirs above; every other explorer feature
  # folder stays flat so files cannot dodge the cohort budgets.
  packages/app/src/mini-apps/explorer/{context-menu,hooks,modal,model,purge-progress,shared,sidebar,toolbar}/*:
    .dir: exists:0

  packages/app/src/mini-apps/identity-manager:
    .*: regex:[A-Za-z0-9][A-Za-z0-9._-]* | exists:0-10
    .*.*: regex:[A-Za-z0-9][A-Za-z0-9._-]* | exists:0-3
    .*.*.*: regex:[A-Za-z0-9][A-Za-z0-9._-]* | exists:0-4

  packages/app/src/mini-apps/identity-manager/*:
    .dir: regex:(menu|panels|sessions|switcher|toolbar)
    .*: regex:[A-Za-z0-9][A-Za-z0-9._-]* | exists:0-8
    .*.*: regex:[A-Za-z0-9][A-Za-z0-9._-]* | exists:0-3
    .*.*.*: regex:[A-Za-z0-9][A-Za-z0-9._-]* | exists:0-2

  packages/app/src/mini-apps/identity-manager/*/*:
    .dir: exists:0

  packages/app/src/mini-apps/org-manager:
    .*: regex:[A-Za-z0-9][A-Za-z0-9._-]* | exists:0-15
    .*.*: regex:[A-Za-z0-9][A-Za-z0-9._-]* | exists:0-6
    .*.*.*: regex:[A-Za-z0-9][A-Za-z0-9._-]* | exists:0-3

  packages/app/src/mini-apps/org-manager/*:
    .dir: regex:(billing|context-menu|directory|grants|groups|hooks|organization|policy-history)
    .*: regex:[A-Za-z0-9][A-Za-z0-9._-]* | exists:0-23
    .*.*: regex:[A-Za-z0-9][A-Za-z0-9._-]* | exists:0-14
    .*.*.*: regex:[A-Za-z0-9][A-Za-z0-9._-]* | exists:0-3

  packages/app/src/mini-apps/org-manager/*/*:
    .dir: exists:0

  packages/app/src/mini-apps/system-monitor:
    .*: regex:[A-Za-z0-9][A-Za-z0-9._-]* | exists:0-12
    .*.*: regex:[A-Za-z0-9][A-Za-z0-9._-]* | exists:0-4
    .*.*.*: regex:[A-Za-z0-9][A-Za-z0-9._-]* | exists:0-2

  packages/app/src/mini-apps/system-monitor/*:
    .dir: regex:(environment|feature-flags|log|report)
    .*: regex:[A-Za-z0-9][A-Za-z0-9._-]* | exists:0-5
    .*.*: regex:[A-Za-z0-9][A-Za-z0-9._-]* | exists:0-3
    .*.*.*: regex:[A-Za-z0-9][A-Za-z0-9._-]* | exists:0-2

  packages/app/src/mini-apps/system-monitor/*/*:
    .dir: exists:0

# A leading `**/` ignore forces ls-lint to walk the entire tree (including every
# nested node_modules) to expand the glob before it can prune anything. Anchoring
# these patterns to the depths where the directories actually live lets ls-lint
# prune during traversal instead, cutting this check from ~16s to ~3s.
ignore:
  - .git
  - .serena
  - "**/.*"
  - node_modules
  - packages/*/node_modules
  - dist
  - packages/*/dist
  - build
  - packages/*/build
  - .turbo
  - packages/*/.turbo
  - packages/api-shared/drizzle/meta/_journal.json
  - packages/api-shared/drizzle-sqlite/meta/_journal.json
  - target
  - playwright-report
  - test-results
  - "packages/app-capacitor/android/**"
  - "packages/app-capacitor/ios/**"
  - "packages/app-capacitor/public/**"
  - "packages/app-capacitor/vendor/bundle/**"

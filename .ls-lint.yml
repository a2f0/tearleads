ls:
  .dir: regex:[A-Za-z0-9][A-Za-z0-9-]*
  .*: regex:[A-Za-z0-9][A-Za-z0-9._-]* | regex:README | regex:Cargo

  # `exists` budgets one suffix-depth cohort at a time. Path-specific blocks
  # override global rules, so each cohort repeats the filename check.
  packages/app/src/mini-apps/explorer:
    .*: regex:[A-Za-z0-9][A-Za-z0-9._-]* | exists:0-9
    .*.*: regex:[A-Za-z0-9][A-Za-z0-9._-]* | exists:0-6
    .*.*.*: regex:[A-Za-z0-9][A-Za-z0-9._-]* | exists:0-3

  packages/app/src/mini-apps/explorer/*:
    .dir: regex:(context-menu|detail|diagnostics|hooks|modal|model|purge-progress|shared|sidebar|toolbar)
    .*: regex:[A-Za-z0-9][A-Za-z0-9._-]* | exists:0-33
    .*.*: regex:[A-Za-z0-9][A-Za-z0-9._-]* | exists:0-17
    .*.*.*: regex:[A-Za-z0-9][A-Za-z0-9._-]* | exists:0-3

  packages/app/src/mini-apps/explorer/detail:
    .*: regex:[A-Za-z0-9][A-Za-z0-9._-]* | exists:0-15
    .*.*: regex:[A-Za-z0-9][A-Za-z0-9._-]* | exists:0-6
    .*.*.*: regex:[A-Za-z0-9][A-Za-z0-9._-]* | exists:0-3

  packages/app/src/mini-apps/explorer/detail/*:
    .dir: regex:(blob|container|document|recovery|sync)
    .*: regex:[A-Za-z0-9][A-Za-z0-9._-]* | exists:0-16
    .*.*: regex:[A-Za-z0-9][A-Za-z0-9._-]* | exists:0-7
    .*.*.*: regex:[A-Za-z0-9][A-Za-z0-9._-]* | exists:0-3

  packages/app/src/mini-apps/explorer/detail/*/*:
    .dir: exists:0

  # detail/* keeps its subject dirs above; every other explorer feature
  # folder stays flat so files cannot dodge the cohort budgets.
  packages/app/src/mini-apps/explorer/{context-menu,diagnostics,hooks,modal,model,purge-progress,shared,sidebar,toolbar}/*:
    .dir: exists:0

  packages/app/src/mini-apps/identity-manager:
    .*: regex:[A-Za-z0-9][A-Za-z0-9._-]* | exists:0-10
    .*.*: regex:[A-Za-z0-9][A-Za-z0-9._-]* | exists:0-3
    .*.*.*: regex:[A-Za-z0-9][A-Za-z0-9._-]* | exists:0-4

  packages/app/src/mini-apps/identity-manager/*:
    .dir: regex:(actions|menu|panels|recovery|sessions|switcher|toolbar)
    .*: regex:[A-Za-z0-9][A-Za-z0-9._-]* | exists:0-8
    .*.*: regex:[A-Za-z0-9][A-Za-z0-9._-]* | exists:0-3
    .*.*.*: regex:[A-Za-z0-9][A-Za-z0-9._-]* | exists:0-2

  packages/app/src/mini-apps/identity-manager/*/*:
    .dir: exists:0

  packages/app/src/mini-apps/org-manager:
    .*: regex:[A-Za-z0-9][A-Za-z0-9._-]* | exists:0-16
    .*.*: regex:[A-Za-z0-9][A-Za-z0-9._-]* | exists:0-6
    .*.*.*: regex:[A-Za-z0-9][A-Za-z0-9._-]* | exists:0-3

  packages/app/src/mini-apps/org-manager/*:
    .dir: regex:(billing|context-menu|directory|grants|groups|hooks|organization|policy-history|refreshers)
    .*: regex:[A-Za-z0-9][A-Za-z0-9._-]* | exists:0-23
    .*.*: regex:[A-Za-z0-9][A-Za-z0-9._-]* | exists:0-14
    .*.*.*: regex:[A-Za-z0-9][A-Za-z0-9._-]* | exists:0-3

  packages/app/src/mini-apps/org-manager/*/*:
    .dir: exists:0

  packages/app/src/mini-apps/root:
    .*: regex:[A-Za-z0-9][A-Za-z0-9-]* | exists:0-10
    .*.*: regex:[A-Za-z0-9][A-Za-z0-9._-]* | exists:0-4
    .*.*.*: regex:[A-Za-z0-9][A-Za-z0-9._-]* | exists:0-2

  packages/app/src/mini-apps/root/*:
    .dir: regex:(identities|organizations|reports)
    .*: regex:[A-Za-z0-9][A-Za-z0-9._-]* | exists:0-10
    .*.*: regex:[A-Za-z0-9][A-Za-z0-9._-]* | exists:0-6
    .*.*.*: regex:[A-Za-z0-9][A-Za-z0-9._-]* | exists:0-2

  packages/app/src/mini-apps/root/*/*:
    .dir: exists:0

  packages/app/src/mini-apps/system-monitor:
    .*: regex:[A-Za-z0-9][A-Za-z0-9._-]* | exists:0-12
    .*.*: regex:[A-Za-z0-9][A-Za-z0-9._-]* | exists:0-4
    .*.*.*: regex:[A-Za-z0-9][A-Za-z0-9._-]* | exists:0-2

  packages/app/src/mini-apps/system-monitor/*:
    .dir: regex:(environment|feature-flags|log|report|requests)
    .*: regex:[A-Za-z0-9][A-Za-z0-9._-]* | exists:0-5
    .*.*: regex:[A-Za-z0-9][A-Za-z0-9._-]* | exists:0-3
    .*.*.*: regex:[A-Za-z0-9][A-Za-z0-9._-]* | exists:0-2

  packages/app/src/mini-apps/system-monitor/*/*:
    .dir: exists:0

  # Client SDK data modules live in a folder named for their subsystem or role
  # (docs/developer/client-sdk-seams.md), so the layer root holds no files.
  packages/client-sdk/src/data:
    .*: regex:README | exists:0-1
    .*.*: exists:0
    .*.*.*: exists:0

  # Below the root, data folders keep the default naming rules.
  packages/client-sdk/src/data/*:
    .dir: regex:[A-Za-z0-9][A-Za-z0-9-]*
    .*: regex:[A-Za-z0-9][A-Za-z0-9._-]* | regex:README
    .*.*: regex:[A-Za-z0-9][A-Za-z0-9._-]*
    .*.*.*: regex:[A-Za-z0-9][A-Za-z0-9._-]*

  # Workflow facades and the shared runtime contract each live in a folder.
  packages/client-sdk/src/workflows:
    .*: regex:README | exists:0-1
    .*.*: exists:0
    .*.*.*: exists:0

  packages/client-sdk/src/workflows/*:
    .dir: regex:[A-Za-z0-9][A-Za-z0-9-]*
    .*: regex:[A-Za-z0-9][A-Za-z0-9._-]* | regex:README
    .*.*: regex:[A-Za-z0-9][A-Za-z0-9._-]*
    .*.*.*: regex:[A-Za-z0-9][A-Za-z0-9._-]*

  # Large SDK folders keep features in subfolders; these budgets pin each
  # folder's root so new modules land in a feature folder or bump the budget
  # on purpose (docs/developer/client-sdk-seams.md).
  packages/client-sdk/src/workflows/container-contents:
    .*: regex:[A-Za-z0-9][A-Za-z0-9._-]* | exists:0-12
    .*.*: regex:[A-Za-z0-9][A-Za-z0-9._-]* | exists:0-5
    .*.*.*: regex:[A-Za-z0-9][A-Za-z0-9._-]* | exists:0

  packages/client-sdk/src/workflows/container-contents/*:
    .dir: regex:[A-Za-z0-9][A-Za-z0-9-]*
    .*: regex:[A-Za-z0-9][A-Za-z0-9._-]* | regex:README
    .*.*: regex:[A-Za-z0-9][A-Za-z0-9._-]*
    .*.*.*: regex:[A-Za-z0-9][A-Za-z0-9._-]*

  packages/client-sdk/src/workflows/blobs:
    .*: regex:[A-Za-z0-9][A-Za-z0-9._-]* | exists:0-2
    .*.*: regex:[A-Za-z0-9][A-Za-z0-9._-]* | exists:0-1
    .*.*.*: regex:[A-Za-z0-9][A-Za-z0-9._-]* | exists:0-0

  packages/client-sdk/src/workflows/blobs/*:
    .dir: regex:[A-Za-z0-9][A-Za-z0-9-]*
    .*: regex:[A-Za-z0-9][A-Za-z0-9._-]* | regex:README
    .*.*: regex:[A-Za-z0-9][A-Za-z0-9._-]*
    .*.*.*: regex:[A-Za-z0-9][A-Za-z0-9._-]*

  packages/client-sdk/src/workflows/documents:
    .*: regex:[A-Za-z0-9][A-Za-z0-9._-]* | exists:0-13
    .*.*: regex:[A-Za-z0-9][A-Za-z0-9._-]* | exists:0-12
    .*.*.*: regex:[A-Za-z0-9][A-Za-z0-9._-]* | exists:0-0

  packages/client-sdk/src/workflows/documents/*:
    .dir: regex:[A-Za-z0-9][A-Za-z0-9-]*
    .*: regex:[A-Za-z0-9][A-Za-z0-9._-]* | regex:README
    .*.*: regex:[A-Za-z0-9][A-Za-z0-9._-]*
    .*.*.*: regex:[A-Za-z0-9][A-Za-z0-9._-]*

  packages/client-sdk/src/workflows/organizations:
    .*: regex:[A-Za-z0-9][A-Za-z0-9._-]* | exists:0-8
    .*.*: regex:[A-Za-z0-9][A-Za-z0-9._-]* | exists:0-6
    .*.*.*: regex:[A-Za-z0-9][A-Za-z0-9._-]* | exists:0-0

  packages/client-sdk/src/workflows/organizations/*:
    .dir: regex:[A-Za-z0-9][A-Za-z0-9-]*
    .*: regex:[A-Za-z0-9][A-Za-z0-9._-]* | regex:README
    .*.*: regex:[A-Za-z0-9][A-Za-z0-9._-]*
    .*.*.*: regex:[A-Za-z0-9][A-Za-z0-9._-]*

  packages/client-sdk/src/workflows/principals:
    .*: regex:[A-Za-z0-9][A-Za-z0-9._-]* | exists:0-10
    .*.*: regex:[A-Za-z0-9][A-Za-z0-9._-]* | exists:0-12
    .*.*.*: regex:[A-Za-z0-9][A-Za-z0-9._-]* | exists:0-0

  packages/client-sdk/src/workflows/principals/*:
    .dir: regex:[A-Za-z0-9][A-Za-z0-9-]*
    .*: regex:[A-Za-z0-9][A-Za-z0-9._-]* | regex:README
    .*.*: regex:[A-Za-z0-9][A-Za-z0-9._-]*
    .*.*.*: regex:[A-Za-z0-9][A-Za-z0-9._-]*

  # The client root holds only its facade barrel; facades, runtime state, and
  # host contracts each live in a folder.
  packages/client-sdk/src/client:
    .*: regex:index | exists:0-1
    .*.*: exists:0
    .*.*.*: exists:0

  packages/client-sdk/src/client/*:
    .dir: regex:[A-Za-z0-9][A-Za-z0-9-]*
    .*: regex:[A-Za-z0-9][A-Za-z0-9._-]* | regex:README
    .*.*: regex:[A-Za-z0-9][A-Za-z0-9._-]*
    .*.*.*: regex:[A-Za-z0-9][A-Za-z0-9._-]*

# A `**/` ignore makes ls-lint walk generated trees before it can prune them.
# Bound hidden-file matches to the depths used in this repo, and ignore generated
# directories by name rather than using a trailing `/**`.
ignore:
  - .git
  - .serena
  - ".*"
  - "*/.*"
  - "*/*/.*"
  - "*/*/*/.*"
  - "*/*/*/*/.*"
  - node_modules
  - packages/*/node_modules
  - dist
  - packages/*/dist
  # Wrangler Static Assets staging copies of the app and demo bundles.
  - packages/app-web/dist-app
  - packages/app-web/dist-demo
  - build
  - packages/*/build
  - .turbo
  - packages/*/.turbo
  - packages/api-shared/drizzle/meta/_journal.json
  - packages/api-shared/drizzle-sqlite/meta/_journal.json
  - target
  - playwright-report
  - test-results
  - packages/app-capacitor/android
  - packages/app-capacitor/ios
  - packages/app-capacitor/public
  - packages/app-capacitor/vendor/bundle

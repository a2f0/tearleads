---
- name: Configure Tearleads server
  hosts: all
  become: true

  vars:
    ansible_python_interpreter: /usr/bin/python3
    linux_security_baseline_manage_ufw: true
    linux_security_baseline_ufw_delete_allow_rules:
      - { port: "22", proto: "tcp" }
      - { port: "80", proto: "tcp" }
      - { port: "443", proto: "tcp" }
    linux_security_baseline_ufw_allow_rules:
      - { port: "22", proto: "tcp", interface: "tailscale0", direction: "in" }
    linux_security_baseline_ssh_settings:
      - { key: "PermitRootLogin", value: "no" }
      - { key: "PasswordAuthentication", value: "no" }
      - { key: "PubkeyAuthentication", value: "yes" }
      - { key: "MaxAuthTries", value: "3" }
      - { key: "KbdInteractiveAuthentication", value: "no" }
    postgres_managed: "{{ deployment_tier == 'prod' }}"
    postgres_ssl: false
    postgres_version: "16"
    postgres_db: "{{ lookup('env', 'POSTGRES_DATABASE') | default('tearleads', true) }}"
    postgres_user: "{{ lookup('env', 'POSTGRES_USER') | default('tearleads', true) }}"
    postgres_password: >-
      {{ lookup('env', 'POSTGRES_PASSWORD') |
      default(lookup('ansible.builtin.password', playbook_dir +
      '/.postgres_password chars=ascii_letters,digits length=32'), true) }}
    document_sync_cursor_hmac_key: >-
      {{ lookup('env', 'DOCUMENT_SYNC_CURSOR_HMAC_KEY') |
      default(lookup('ansible.builtin.password', playbook_dir +
      '/.document_sync_cursor_hmac_key chars=ascii_letters,digits length=64'), true) }}
    postgres_host: "{{ lookup('env', 'POSTGRES_HOST') | default('127.0.0.1', true) }}"
    postgres_port: "{{ lookup('env', 'POSTGRES_PORT') | default('5432', true) }}"
    redis_bind: "127.0.0.1"
    deployment_tier: "{{ lookup('env', 'DEPLOYMENT_TIER') | default('prod', true) }}"
    domain: "{{ lookup('env', 'TF_VAR_domain') | default('', true) }}"
    api_hostname: >-
      {{ 'api-staging.' ~ domain if deployment_tier == 'staging'
      else 'api.' ~ domain }}
    app_hostname: >-
      {{ 'app-staging.' ~ domain if deployment_tier == 'staging'
      else 'app.' ~ domain }}
    app_demo_host_prefix: "{{ 'demo-staging.' if deployment_tier == 'staging' else 'demo.' }}"
    app_demo_hostname: "{{ app_demo_host_prefix ~ domain }}"
    # The demo also answers on other Cloudflare zones (e.g. tearleads.de). One
    # zone list drives all three of its surfaces -- Terraform reads
    # TF_VAR_extra_demo_domains for the DNS records and tunnel ingress, and this
    # play and the app-web deploy read the same value -- so a host can never be
    # routed here without a server block and a CORS origin to answer it.
    extra_demo_domain_pattern: '^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$'
    extra_demo_domains_raw: "{{ lookup('env', 'TF_VAR_extra_demo_domains') | default('[]', true) }}"
    extra_demo_domains: "{{ extra_demo_domains_raw | from_json }}"
    app_demo_hostnames: >-
      {{ [app_demo_hostname] + (extra_demo_domains |
      map('regex_replace', '^', app_demo_host_prefix) | list) }}
    website_hostname: >-
      {{ 'website-staging.' ~ domain if deployment_tier == 'staging'
      else domain }}
    cloudflare_tunnel_token: "{{ lookup('env', 'CLOUDFLARE_TUNNEL_TOKEN') | default('', true) }}"
    server_user: "{{ lookup('env', 'TF_VAR_server_username') | default('deploy', true) }}"
    bun_path: "/home/{{ server_user }}/.bun/bin/bun"
    bun_version: "1.4.2"
    bun_linux_x64_checksum: "sha256:36368faef7527875d5ffa52e53cd48021741f2a83eb6208a8dd64068d422a913"
    nginx_worker_connections: 1024
    garage_enabled: "{{ lookup('env', 'GARAGE_ENABLED') | default('true', true) }}"
    garage_version: "{{ lookup('env', 'GARAGE_VERSION') | default('v2.4.0', true) }}"
    garage_db_engine: "{{ lookup('env', 'GARAGE_DB_ENGINE') | default('lmdb', true) }}"
    garage_binary_arch_map:
      aarch64: aarch64-unknown-linux-musl
      arm64: aarch64-unknown-linux-musl
      x86_64: x86_64-unknown-linux-musl
      amd64: x86_64-unknown-linux-musl
      i386: i686-unknown-linux-musl
      i686: i686-unknown-linux-musl
    garage_binary_checksums:
      v2.4.0:
        aarch64-unknown-linux-musl: sha256:1d0e5fa62b12eb10fcc26f83c857d762a22ddb45bd436f96cba5d824e2275c24
        i686-unknown-linux-musl: sha256:e58f4d08dc3679e868eefd5180c044ced5543bf902c92d82fa9e64d84fcc44fd
        x86_64-unknown-linux-musl: sha256:1a93848b61d3128a6f98aff301b7f23d66cdcc1dc9cf7aa0768e382901eebf37
    garage_binary_arch: "{{ garage_binary_arch_map.get(ansible_facts['architecture'], ansible_facts['architecture']) }}"
    garage_default_binary_checksum: "{{ garage_binary_checksums.get(garage_version, {}).get(garage_binary_arch, '') }}"
    garage_binary_url: "https://garagehq.deuxfleurs.fr/_releases/{{ garage_version }}/{{ garage_binary_arch }}/garage"
    garage_binary_checksum: "{{ lookup('env', 'GARAGE_BINARY_CHECKSUM') | default(garage_default_binary_checksum, true) }}"
    garage_rpc_secret: "{{ lookup('env', 'GARAGE_RPC_SECRET') | default('', true) }}"
    garage_admin_token: "{{ lookup('env', 'GARAGE_ADMIN_TOKEN') | default('', true) }}"
    garage_metrics_token: "{{ lookup('env', 'GARAGE_METRICS_TOKEN') | default('', true) }}"
    blob_object_store_default: "{{ 's3' if garage_enabled | bool else 'memory' }}"
    blob_object_store: "{{ lookup('env', 'BLOB_OBJECT_STORE') | default(blob_object_store_default, true) }}"
    blob_s3_bucket: "{{ lookup('env', 'BLOB_OBJECT_STORE_S3_BUCKET') | default('tearleads-blobs', true) }}"
    blob_s3_region: "{{ lookup('env', 'BLOB_OBJECT_STORE_S3_REGION') | default('garage', true) }}"
    blob_s3_endpoint: "{{ lookup('env', 'BLOB_OBJECT_STORE_S3_ENDPOINT') | default('http://127.0.0.1:3900', true) }}"
    blob_s3_force_path_style: "{{ lookup('env', 'BLOB_OBJECT_STORE_S3_FORCE_PATH_STYLE') | default('true', true) }}"
    blob_s3_access_key_id: "{{ lookup('env', 'BLOB_OBJECT_STORE_S3_ACCESS_KEY_ID') | default('', true) }}"
    blob_s3_secret_access_key: "{{ lookup('env', 'BLOB_OBJECT_STORE_S3_SECRET_ACCESS_KEY') | default('', true) }}"
    blob_s3_key_prefix: "{{ lookup('env', 'BLOB_OBJECT_STORE_S3_KEY_PREFIX') | default('', true) }}"
    # The Capacitor Android/iOS WebView serves the app from https://localhost; release builds fetch the API cross-origin, so allow it.
    api_web_cors_origins: "{{ ([app_hostname] + app_demo_hostnames) | map('regex_replace', '^(.*)$', 'https://\\1') | list }}"
    api_default_cors_origins: "{{ (api_web_cors_origins + ['https://localhost']) | join(',') }}"
    # An explicit API_CORS_ORIGINS replaces the computed list outright, demo
    # origins included; set it only with the full allowlist for the tier.
    api_cors_origins: "{{ lookup('env', 'API_CORS_ORIGINS') | default(api_default_cors_origins, true) }}"
    revenuecat_webhook_auth_header: "{{ lookup('env', 'REVENUECAT_WEBHOOK_AUTH_HEADER') | default('', true) }}"
    revenuecat_v2_secret_key: "{{ lookup('env', 'REVENUECAT_V2_SECRET_KEY') | default('', true) }}"
    revenuecat_project_id: "{{ lookup('env', 'REVENUECAT_PROJECT_ID') | default('', true) }}"
    revenuecat_allow_sandbox_events: "{{ lookup('env', 'REVENUECAT_ALLOW_SANDBOX_EVENTS') | default('', true) }}"
    stripe_secret_key: "{{ lookup('env', 'STRIPE_SECRET_KEY') | default('', true) }}"
    stripe_webhook_secret: "{{ lookup('env', 'STRIPE_WEBHOOK_SECRET') | default('', true) }}"
    stripe_sync_solo_price_id: "{{ lookup('env', 'STRIPE_SYNC_SOLO_PRICE_ID') | default('', true) }}"
    stripe_sync_team_5_price_id: "{{ lookup('env', 'STRIPE_SYNC_TEAM_5_PRICE_ID') | default('', true) }}"
    stripe_sync_team_10_price_id: "{{ lookup('env', 'STRIPE_SYNC_TEAM_10_PRICE_ID') | default('', true) }}"
    revenuecat_stripe_public_api_key: "{{ lookup('env', 'REVENUECAT_STRIPE_PUBLIC_API_KEY') | default('', true) }}"
    garage_s3_region: "{{ blob_s3_region }}"
    garage_default_access_key: "{{ blob_s3_access_key_id }}"
    garage_default_secret_key: "{{ blob_s3_secret_access_key }}"
    garage_default_bucket: "{{ blob_s3_bucket }}"

  tasks:
    - name: Validate managed PostgreSQL connection
      ansible.builtin.import_tasks: tasks/managedPostgres.yml
      when: postgres_managed | bool

    - name: Validate extra demo zone names
      ansible.builtin.import_tasks: tasks/demoZones.yml

    - name: Apply shared Linux security baseline
      ansible.builtin.import_tasks: tasks/linuxSecurityBaseline.yml

    - name: Wait for cloud-init to complete
      ansible.builtin.command:
        cmd: cloud-init status --wait
      register: cloud_init_status
      changed_when: false
      failed_when: cloud_init_status.rc != 0

    - name: Verify Tailscale is running
      ansible.builtin.command:
        cmd: tailscale status
      register: tailscale_status
      changed_when: false
      failed_when: tailscale_status.rc != 0

    - name: Display Tailscale status
      ansible.builtin.debug:
        var: tailscale_status.stdout_lines

    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install nginx
      ansible.builtin.apt:
        name: nginx
        state: present
      notify: Reload nginx

    - name: Configure nginx main settings
      ansible.builtin.template:
        src: etc/nginx/nginx.conf.j2
        dest: /etc/nginx/nginx.conf
        owner: root
        group: root
        mode: "0644"
      notify: Reload nginx

    - name: Remove default nginx site
      ansible.builtin.file:
        path: /etc/nginx/sites-enabled/default
        state: absent
      notify: Reload nginx

    - name: Configure static site roots and nginx sites
      ansible.builtin.import_tasks: tasks/staticSites.yml

    - name: Configure nginx site for API
      ansible.builtin.template:
        src: etc/nginx/sites-available/api.conf.j2
        dest: /etc/nginx/sites-available/api.conf
        owner: root
        group: root
        mode: "0644"
      notify: Reload nginx

    - name: Enable nginx API site
      ansible.builtin.file:
        src: /etc/nginx/sites-available/api.conf
        dest: /etc/nginx/sites-enabled/api.conf
        state: link
      notify: Reload nginx

    - name: Ensure nginx is enabled and started
      ansible.builtin.systemd:
        name: nginx
        enabled: true
        state: started

    - name: Inspect nginx listeners before handler reloads
      ansible.builtin.command:
        argv:
          - ss
          - -H
          - -lnt
          - "( sport = :80 or sport = :443 )"
      register: nginx_listener_scan
      changed_when: false

    - name: Restart nginx to close inherited public listeners
      ansible.builtin.systemd:
        name: nginx
        state: restarted
      when: >-
        '0.0.0.0:80' in nginx_listener_scan.stdout or
        '0.0.0.0:443' in nginx_listener_scan.stdout or
        '[::]:80' in nginx_listener_scan.stdout or
        '[::]:443' in nginx_listener_scan.stdout

    - name: Install deploy helper packages
      ansible.builtin.apt:
        name:
          - acl
          - ca-certificates
          - unzip
        state: present

    - name: Remove obsolete certbot packages
      ansible.builtin.apt:
        name:
          - certbot
          - python3-certbot-nginx
        state: absent
        purge: true

    - name: Add Cloudflare package signing key
      ansible.builtin.get_url:
        url: https://pkg.cloudflare.com/cloudflare-main.gpg
        dest: /usr/share/keyrings/cloudflare-main.gpg
        mode: "0644"
      when: cloudflare_tunnel_token != ""

    - name: Add Cloudflare cloudflared apt repository
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/usr/share/keyrings/cloudflare-main.gpg] https://pkg.cloudflare.com/cloudflared any main"
        state: present
      when: cloudflare_tunnel_token != ""

    - name: Install cloudflared
      ansible.builtin.apt:
        name: cloudflared
        state: present
        update_cache: true
      when: cloudflare_tunnel_token != ""

    - name: Configure cloudflared tunnel service
      ansible.builtin.copy:
        dest: /etc/systemd/system/cloudflared.service
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=cloudflare-tunnel
          After=network.target

          [Service]
          TimeoutStartSec=0
          Type=simple
          ExecStart=/usr/bin/cloudflared --no-autoupdate tunnel run --token {{ cloudflare_tunnel_token }}
          Restart=on-failure
          RestartSec=5s

          [Install]
          WantedBy=multi-user.target
      register: cloudflared_service_file
      no_log: true
      when: cloudflare_tunnel_token != ""

    - name: Ensure cloudflared is enabled and started
      ansible.builtin.systemd:
        name: cloudflared
        daemon_reload: true
        enabled: true
        state: "{{ 'restarted' if cloudflared_service_file.changed else 'started' }}"
      when: cloudflare_tunnel_token != ""

    - name: Install Bun
      ansible.builtin.include_tasks: tasks/bun.yml

    - name: Create application directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ server_user }}"
        group: "{{ server_user }}"
        mode: "0755"
      loop:
        - /opt/tearleads
        - /opt/tearleads/bin
        - /etc/tearleads

    - name: Add deployed executables to login shell PATH
      ansible.builtin.template:
        src: etc/profile-d/tearleads.sh.j2
        dest: /etc/profile.d/tearleads.sh
        owner: root
        group: root
        mode: "0644"

    - name: Deploy API CLI operator wrapper
      ansible.builtin.template:
        src: usr/local/bin/tearleads-api-cli.j2
        dest: /usr/local/bin/tearleads-api-cli
        owner: root
        group: root
        mode: "0755"

    - name: Configure Garage S3 object storage
      ansible.builtin.import_tasks: tasks/garage.yml

    - name: Deploy API environment file
      ansible.builtin.template:
        src: etc/tearleads/api.env.j2
        dest: /etc/tearleads/api.env
        owner: root
        group: "{{ server_user }}"
        mode: "0640"
      notify: Restart tearleads-api
      no_log: true

    - name: Deploy migration environment file
      ansible.builtin.template:
        src: etc/tearleads/migrations.env.j2
        dest: /etc/tearleads/migrations.env
        owner: root
        group: root
        mode: "0600"
      no_log: true

    - name: Deploy API systemd service
      ansible.builtin.template:
        src: etc/systemd/system/tearleads-api.service.j2
        dest: /etc/systemd/system/tearleads-api.service
        owner: root
        group: root
        mode: "0644"
      notify: Restart tearleads-api

    - name: Enable API systemd service
      ansible.builtin.systemd:
        name: tearleads-api
        daemon_reload: true
        enabled: true

    - name: Configure API maintenance timers
      ansible.builtin.import_tasks: tasks/apiMaintenance.yml

    - name: Install Redis
      ansible.builtin.apt:
        name: redis-server
        state: present
      notify: Restart redis

    - name: Configure Redis
      ansible.builtin.lineinfile:
        path: /etc/redis/redis.conf
        regexp: '^#?[[:space:]]*bind[[:space:]]'
        line: "bind {{ redis_bind }}"
      notify: Restart redis

    - name: Configure Redis protected mode
      ansible.builtin.lineinfile:
        path: /etc/redis/redis.conf
        regexp: '^#?[[:space:]]*protected-mode[[:space:]]'
        line: "protected-mode yes"
      notify: Restart redis

    - name: Ensure Redis is enabled and started
      ansible.builtin.systemd:
        name: redis-server
        enabled: true
        state: started

    - name: Configure local PostgreSQL
      ansible.builtin.import_tasks: tasks/localPostgres.yml
      when: not postgres_managed | bool

  handlers:
    - name: Restart sshd
      ansible.builtin.systemd:
        name: ssh
        state: restarted

    - name: Reload nginx
      ansible.builtin.systemd:
        name: nginx
        state: reloaded

    - name: Restart redis
      ansible.builtin.systemd:
        name: redis-server
        state: restarted

    - name: Restart PostgreSQL
      when: not postgres_managed | bool
      ansible.builtin.systemd:
        name: "postgresql@{{ postgres_version }}-main"
        state: restarted

    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Restart garage
      ansible.builtin.systemd:
        name: garage
        daemon_reload: true
        state: restarted

    - name: Check if tearleads-api binary exists
      ansible.builtin.stat:
        path: /opt/tearleads/bin/tearleads-api
      register: tearleads_api_bin
      listen: Restart tearleads-api

    - name: Restart tearleads-api service
      ansible.builtin.systemd:
        name: tearleads-api
        daemon_reload: true
        state: restarted
      when: tearleads_api_bin.stat.exists | default(false)
      listen: Restart tearleads-api

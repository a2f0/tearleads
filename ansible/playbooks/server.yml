---
- name: Configure Tearleads server
  hosts: all
  become: true

  vars:
    ansible_python_interpreter: /usr/bin/python3
    linux_security_baseline_manage_ufw: true
    linux_security_baseline_ufw_allow_rules:
      - { port: "22", proto: "tcp" }
      - { port: "80", proto: "tcp" }
      - { port: "443", proto: "tcp" }
    linux_security_baseline_ssh_settings:
      - { key: "PermitRootLogin", value: "no" }
      - { key: "PasswordAuthentication", value: "no" }
      - { key: "PubkeyAuthentication", value: "yes" }
      - { key: "MaxAuthTries", value: "3" }
      - { key: "KbdInteractiveAuthentication", value: "no" }
    postgres_version: "16"
    postgres_db: "tearleads"
    postgres_user: "tearleads"
    postgres_password: "{{ lookup('ansible.builtin.password', '/dev/null chars=ascii_letters,digits length=32') }}"
    postgres_host: "127.0.0.1"
    redis_bind: "127.0.0.1"
    nginx_worker_connections: 1024
    certbot_email: "{{ lookup('env', 'CERTBOT_EMAIL') | default('admin@' + (domain | default('tearleads.com')), true) }}"

  tasks:
    - name: Apply shared Linux security baseline
      ansible.builtin.import_tasks: tasks/linuxSecurityBaseline.yml

    - name: Wait for cloud-init to complete
      ansible.builtin.command:
        cmd: cloud-init status --wait
      register: cloud_init_status
      changed_when: false
      failed_when: cloud_init_status.rc != 0

    - name: Verify Tailscale is running
      ansible.builtin.command:
        cmd: tailscale status
      register: tailscale_status
      changed_when: false
      failed_when: tailscale_status.rc != 0

    - name: Display Tailscale status
      ansible.builtin.debug:
        var: tailscale_status.stdout_lines

    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install nginx
      ansible.builtin.apt:
        name: nginx
        state: present
      notify: Reload nginx

    - name: Configure nginx main settings
      ansible.builtin.template:
        src: etc/nginx/nginx.conf.j2
        dest: /etc/nginx/nginx.conf
        owner: root
        group: root
        mode: "0644"
      notify: Reload nginx

    - name: Remove default nginx site
      ansible.builtin.file:
        path: /etc/nginx/sites-enabled/default
        state: absent
      notify: Reload nginx

    - name: Configure nginx site for application
      ansible.builtin.template:
        src: etc/nginx/sites-available/app.conf.j2
        dest: /etc/nginx/sites-available/app.conf
        owner: root
        group: root
        mode: "0644"
      notify: Reload nginx

    - name: Enable nginx site
      ansible.builtin.file:
        src: /etc/nginx/sites-available/app.conf
        dest: /etc/nginx/sites-enabled/app.conf
        state: link
      notify: Reload nginx

    - name: Ensure nginx is enabled and started
      ansible.builtin.systemd:
        name: nginx
        enabled: true
        state: started

    - name: Install certbot and nginx plugin
      ansible.builtin.apt:
        name:
          - certbot
          - python3-certbot-nginx
        state: present

    - name: Install Redis
      ansible.builtin.apt:
        name: redis-server
        state: present
      notify: Restart redis

    - name: Configure Redis
      ansible.builtin.lineinfile:
        path: /etc/redis/redis.conf
        regexp: "^bind "
        line: "bind {{ redis_bind }}"
      notify: Restart redis

    - name: Configure Redis protected mode
      ansible.builtin.lineinfile:
        path: /etc/redis/redis.conf
        regexp: "^protected-mode "
        line: "protected-mode yes"
      notify: Restart redis

    - name: Ensure Redis is enabled and started
      ansible.builtin.systemd:
        name: redis-server
        enabled: true
        state: started

    - name: Install PostgreSQL
      ansible.builtin.apt:
        name:
          - "postgresql-{{ postgres_version }}"
          - "postgresql-client-{{ postgres_version }}"
        state: present

    - name: Ensure PostgreSQL is enabled and started
      ansible.builtin.systemd:
        name: "postgresql@{{ postgres_version }}-main"
        enabled: true
        state: started

    - name: Check if PostgreSQL database exists
      ansible.builtin.command:
        cmd: psql -tc "SELECT 1 FROM pg_database WHERE datname = '{{ postgres_db }}'"
      become: true
      become_user: postgres
      register: db_exists
      changed_when: false
      failed_when: false

    - name: Create PostgreSQL database
      ansible.builtin.command:
        cmd: createdb --encoding=UTF-8 --lc-collate=en_US.UTF-8 --lc-ctype=en_US.UTF-8 "{{ postgres_db }}"
      become: true
      become_user: postgres
      when: "'1' not in db_exists.stdout"

    - name: Check if PostgreSQL user exists
      ansible.builtin.command:
        cmd: psql -tc "SELECT 1 FROM pg_roles WHERE rolname = '{{ postgres_user }}'"
      become: true
      become_user: postgres
      register: user_exists
      changed_when: false
      failed_when: false

    - name: Create PostgreSQL user
      ansible.builtin.shell:
        cmd: psql -c "CREATE USER \"{{ postgres_user }}\" WITH PASSWORD '{{ postgres_password }}'"
      become: true
      become_user: postgres
      no_log: true
      when: "'1' not in user_exists.stdout"

    - name: Grant database privileges
      ansible.builtin.command:
        cmd: psql -c "GRANT ALL PRIVILEGES ON DATABASE \"{{ postgres_db }}\" TO \"{{ postgres_user }}\""
      become: true
      become_user: postgres
      changed_when: false

    - name: Show generated PostgreSQL password
      ansible.builtin.debug:
        msg: "PostgreSQL user '{{ postgres_user }}' created with password: {{ postgres_password }}"
      no_log: true

  handlers:
    - name: Restart sshd
      ansible.builtin.systemd:
        name: ssh
        state: restarted

    - name: Reload nginx
      ansible.builtin.systemd:
        name: nginx
        state: reloaded

    - name: Restart redis
      ansible.builtin.systemd:
        name: redis-server
        state: restarted

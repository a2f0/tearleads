---
- name: Configure Tearleads server
  hosts: all
  become: true

  vars:
    ansible_python_interpreter: /usr/bin/python3
    linux_security_baseline_manage_ufw: true
    linux_security_baseline_ufw_allow_rules:
      - { port: "22", proto: "tcp" }
      - { port: "80", proto: "tcp" }
      - { port: "443", proto: "tcp" }
    linux_security_baseline_ssh_settings:
      - { key: "PermitRootLogin", value: "no" }
      - { key: "PasswordAuthentication", value: "no" }
      - { key: "PubkeyAuthentication", value: "yes" }
      - { key: "MaxAuthTries", value: "3" }
      - { key: "KbdInteractiveAuthentication", value: "no" }
    postgres_version: "16"
    postgres_db: "tearleads"
    postgres_user: "tearleads"
    postgres_password: "{{ lookup('env', 'DATABASE_PASSWORD') | default(lookup('ansible.builtin.password', playbook_dir + '/.postgres_password chars=ascii_letters,digits length=32'), true) }}"
    postgres_host: "127.0.0.1"
    redis_bind: "127.0.0.1"
    domain: "{{ lookup('env', 'TF_VAR_domain') | default('', true) }}"
    server_user: "{{ lookup('env', 'TF_VAR_server_username') | default('deploy', true) }}"
    bun_path: "/home/{{ server_user }}/.bun/bin/bun"
    nginx_worker_connections: 1024
    certbot_email: "{{ lookup('env', 'CERTBOT_EMAIL') | default('admin@' + (domain | default('tearleads.com')), true) }}"

  tasks:
    - name: Apply shared Linux security baseline
      ansible.builtin.import_tasks: tasks/linuxSecurityBaseline.yml

    - name: Wait for cloud-init to complete
      ansible.builtin.command:
        cmd: cloud-init status --wait
      register: cloud_init_status
      changed_when: false
      failed_when: cloud_init_status.rc != 0

    - name: Verify Tailscale is running
      ansible.builtin.command:
        cmd: tailscale status
      register: tailscale_status
      changed_when: false
      failed_when: tailscale_status.rc != 0

    - name: Display Tailscale status
      ansible.builtin.debug:
        var: tailscale_status.stdout_lines

    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install nginx
      ansible.builtin.apt:
        name: nginx
        state: present
      notify: Reload nginx

    - name: Configure nginx main settings
      ansible.builtin.template:
        src: etc/nginx/nginx.conf.j2
        dest: /etc/nginx/nginx.conf
        owner: root
        group: root
        mode: "0644"
      notify: Reload nginx

    - name: Remove default nginx site
      ansible.builtin.file:
        path: /etc/nginx/sites-enabled/default
        state: absent
      notify: Reload nginx

    - name: Configure nginx site for application
      ansible.builtin.template:
        src: etc/nginx/sites-available/app.conf.j2
        dest: /etc/nginx/sites-available/app.conf
        owner: root
        group: root
        mode: "0644"
      notify: Reload nginx

    - name: Enable nginx site
      ansible.builtin.file:
        src: /etc/nginx/sites-available/app.conf
        dest: /etc/nginx/sites-enabled/app.conf
        state: link
      notify: Reload nginx

    - name: Create website directory
      ansible.builtin.file:
        path: /var/www/website
        state: directory
        owner: www-data
        group: www-data
        mode: "0755"

    - name: Configure nginx site for website
      ansible.builtin.template:
        src: etc/nginx/sites-available/website.conf.j2
        dest: /etc/nginx/sites-available/website.conf
        owner: root
        group: root
        mode: "0644"
      notify: Reload nginx

    - name: Enable nginx website site
      ansible.builtin.file:
        src: /etc/nginx/sites-available/website.conf
        dest: /etc/nginx/sites-enabled/website.conf
        state: link
      notify: Reload nginx

    - name: Configure nginx site for API
      ansible.builtin.template:
        src: etc/nginx/sites-available/api.conf.j2
        dest: /etc/nginx/sites-available/api.conf
        owner: root
        group: root
        mode: "0644"
      notify: Reload nginx

    - name: Enable nginx API site
      ansible.builtin.file:
        src: /etc/nginx/sites-available/api.conf
        dest: /etc/nginx/sites-enabled/api.conf
        state: link
      notify: Reload nginx

    - name: Ensure nginx is enabled and started
      ansible.builtin.systemd:
        name: nginx
        enabled: true
        state: started

    - name: Install certbot and nginx plugin
      ansible.builtin.apt:
        name:
          - certbot
          - python3-certbot-nginx
          - unzip
        state: present

    - name: Install deploy helper packages
      ansible.builtin.apt:
        name:
          - acl
          - unzip
        state: present

    - name: Install Bun
      ansible.builtin.shell:
        cmd: curl -fsSL https://bun.sh/install | bash
        creates: /home/{{ server_user }}/.bun/bin/bun
      become: true
      become_user: "{{ server_user }}"

    - name: Create application directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ server_user }}"
        group: "{{ server_user }}"
        mode: "0755"
      loop:
        - /opt/tearleads
        - /etc/tearleads

    - name: Deploy API environment file
      ansible.builtin.template:
        src: etc/tearleads/api.env.j2
        dest: /etc/tearleads/api.env
        owner: root
        group: "{{ server_user }}"
        mode: "0640"

    - name: Deploy app-web environment file
      ansible.builtin.template:
        src: etc/tearleads/app-web.env.j2
        dest: /etc/tearleads/app-web.env
        owner: root
        group: "{{ server_user }}"
        mode: "0640"

    - name: Deploy API systemd service
      ansible.builtin.template:
        src: etc/systemd/system/tearleads-api.service.j2
        dest: /etc/systemd/system/tearleads-api.service
        owner: root
        group: root
        mode: "0644"
      notify: Restart tearleads-api

    - name: Deploy app-web systemd service
      ansible.builtin.template:
        src: etc/systemd/system/tearleads-app-web.service.j2
        dest: /etc/systemd/system/tearleads-app-web.service
        owner: root
        group: root
        mode: "0644"
      notify: Restart tearleads-app-web

    - name: Enable API systemd service
      ansible.builtin.systemd:
        name: tearleads-api
        daemon_reload: true
        enabled: true

    - name: Enable app-web systemd service
      ansible.builtin.systemd:
        name: tearleads-app-web
        daemon_reload: true
        enabled: true

    - name: Install Redis
      ansible.builtin.apt:
        name: redis-server
        state: present
      notify: Restart redis

    - name: Configure Redis
      ansible.builtin.lineinfile:
        path: /etc/redis/redis.conf
        regexp: '^#?[[:space:]]*bind[[:space:]]'
        line: "bind {{ redis_bind }}"
      notify: Restart redis

    - name: Configure Redis protected mode
      ansible.builtin.lineinfile:
        path: /etc/redis/redis.conf
        regexp: '^#?[[:space:]]*protected-mode[[:space:]]'
        line: "protected-mode yes"
      notify: Restart redis

    - name: Ensure Redis is enabled and started
      ansible.builtin.systemd:
        name: redis-server
        enabled: true
        state: started

    - name: Install PostgreSQL
      ansible.builtin.apt:
        name:
          - "postgresql-{{ postgres_version }}"
          - "postgresql-client-{{ postgres_version }}"
          - python3-psycopg2
        state: present

    - name: Ensure PostgreSQL is enabled and started
      ansible.builtin.systemd:
        name: "postgresql@{{ postgres_version }}-main"
        enabled: true
        state: started

    - name: Create or update PostgreSQL user
      community.postgresql.postgresql_user:
        name: "{{ postgres_user }}"
        password: "{{ postgres_password }}"
      become: true
      become_user: postgres
      no_log: true

    - name: Create PostgreSQL database
      community.postgresql.postgresql_db:
        name: "{{ postgres_db }}"
        owner: "{{ postgres_user }}"
        encoding: UTF-8
        lc_collate: en_US.UTF-8
        lc_ctype: en_US.UTF-8
      become: true
      become_user: postgres

    - name: Grant database privileges
      community.postgresql.postgresql_privs:
        db: "{{ postgres_db }}"
        role: "{{ postgres_user }}"
        type: database
        privs: ALL
      become: true
      become_user: postgres

  handlers:
    - name: Restart sshd
      ansible.builtin.systemd:
        name: ssh
        state: restarted

    - name: Reload nginx
      ansible.builtin.systemd:
        name: nginx
        state: reloaded

    - name: Restart redis
      ansible.builtin.systemd:
        name: redis-server
        state: restarted

    - name: Restart tearleads-api
      ansible.builtin.systemd:
        name: tearleads-api
        daemon_reload: true
        state: restarted

    - name: Restart tearleads-app-web
      ansible.builtin.systemd:
        name: tearleads-app-web
        daemon_reload: true
        state: restarted

---
- name: Install PostgreSQL
  ansible.builtin.apt:
    name:
      - "postgresql-{{ postgres_version }}"
      - "postgresql-client-{{ postgres_version }}"
      - python3-psycopg2
    state: present

- name: Ensure PostgreSQL is enabled and started
  ansible.builtin.systemd:
    name: "postgresql@{{ postgres_version }}-main"
    enabled: true
    state: started

- name: Restrict PostgreSQL to loopback interfaces
  community.postgresql.postgresql_alter_system:
    param: listen_addresses
    value: "127.0.0.1, ::1"
  become: true
  become_user: postgres
  notify: Restart PostgreSQL

- name: Create or update PostgreSQL user
  community.postgresql.postgresql_user:
    name: "{{ postgres_user }}"
    password: "{{ postgres_password }}"
  become: true
  become_user: postgres
  no_log: true

- name: Create PostgreSQL database
  community.postgresql.postgresql_db:
    name: "{{ postgres_db }}"
    owner: "{{ postgres_user }}"
    encoding: UTF-8
    lc_collate: en_US.UTF-8
    lc_ctype: en_US.UTF-8
  become: true
  become_user: postgres

- name: Grant database privileges
  community.postgresql.postgresql_privs:
    login_db: "{{ postgres_db }}"
    role: "{{ postgres_user }}"
    type: database
    privs: ALL
  become: true
  become_user: postgres

---
- name: Inspect superseded SymCrypt timer units
  ansible.builtin.stat:
    path: "/etc/systemd/system/{{ item }}"
  loop:
    - symcrypt-blob-gc.timer
    - symcrypt-stripe-seat-sync.timer
  register: superseded_symcrypt_timers

- name: Stop and disable superseded SymCrypt timers
  ansible.builtin.systemd:
    name: "{{ item.item }}"
    enabled: false
    state: stopped
  loop: "{{ superseded_symcrypt_timers.results }}"
  when: item.stat.exists

- name: Inspect superseded SymCrypt service units
  ansible.builtin.stat:
    path: "/etc/systemd/system/{{ item }}"
  loop:
    - symcrypt-api.service
    - symcrypt-blob-gc.service
    - symcrypt-code-assist.service
    - symcrypt-stripe-seat-sync.service
  register: superseded_symcrypt_services

- name: Stop and disable superseded SymCrypt services
  ansible.builtin.systemd:
    name: "{{ item.item }}"
    enabled: false
    state: stopped
  loop: "{{ superseded_symcrypt_services.results }}"
  when: item.stat.exists

- name: Remove superseded SymCrypt systemd unit files
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ item.item }}"
    state: absent
  loop: >-
    {{ superseded_symcrypt_timers.results
       + superseded_symcrypt_services.results }}
  when: item.stat.exists

- name: Remove superseded SymCrypt application directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /opt/symcrypt
    - /etc/symcrypt

[package]
name = "http-server"
version = "0.1.0"
edition = "2024"

[dependencies]
protocol = { path = "../protocol" }
store = { path = "../store" }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
tracing = "0.1"
tracing-subscriber = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

services:
  localstack:
    image: localstack/localstack:4.14.0
    restart: unless-stopped
    environment:
      SERVICES: s3
      AWS_DEFAULT_REGION: us-east-1
      PERSISTENCE: "1"
      S3_SKIP_SIGNATURE_VALIDATION: "0"
    ports:
      - "4566:4566"
    volumes:
      - ./data:/var/lib/localstack

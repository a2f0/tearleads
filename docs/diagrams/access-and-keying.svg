<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1256" viewBox="0 0 1000 1256" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Tearleads access lookup and keying</title>
  <defs>
    <marker id="access-keying-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
    <marker id="access-keying-arrow-key" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead-key"/>
    </marker>
    <style>
      .sub { font-size: 13.5px; fill: #4b5563; }
      .colhead { font-size: 13px; font-weight: 600; fill: #111827; letter-spacing: 0.04em; text-transform: uppercase; }
      .lane { font-size: 15px; font-weight: 600; fill: #111827; }
      .lanesub { font-size: 12px; fill: #6b7280; }
      .box { fill: #ffffff; stroke: #4b5563; stroke-width: 1.25; }
      .kbox { fill: #ffffff; stroke: #b45309; stroke-width: 1.25; stroke-dasharray: 5 3; }
      .name { font-size: 14px; font-weight: 600; fill: #111827; }
      .meta { font-size: 12px; fill: #4b5563; }
      .mono { font-size: 12px; fill: #374151; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .key { font-size: 12px; fill: #b45309; font-weight: 600; }
      .keymono { font-size: 12px; fill: #92400e; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .edge { fill: none; stroke: #4b5563; stroke-width: 1.25; }
      .kedge { fill: none; stroke: #b45309; stroke-width: 1.25; stroke-dasharray: 5 3; }
      .elabel { font-size: 12px; fill: #374151; }
      .klabel { font-size: 12px; fill: #92400e; }
      .step { fill: #1d4ed8; }
      .stepnum { font-size: 12px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
      .foot { font-size: 13px; fill: #374151; }
      .foothead { font-size: 13px; font-weight: 600; fill: #111827; }
      .canvas { fill: #ffffff; }
      .band { fill: #f8fafc; }
      .rule { stroke: #d1d5db; stroke-width: 1; }
      .arrowhead { fill: #4b5563; }
      .arrowhead-key { fill: #b45309; }
    </style>
  </defs>

  <rect x="0" y="0" width="1000" height="1256" class="canvas"/>

  <!-- Lane bands -->
  <rect x="0" y="36" width="1000" height="180" class="band"/>
  <rect x="0" y="216" width="1000" height="266" class="canvas"/>
  <rect x="0" y="482" width="1000" height="154" class="band"/>
  <rect x="0" y="636" width="1000" height="140" class="canvas"/>
  <rect x="0" y="776" width="1000" height="130" class="band"/>
  <g class="rule">
    <line x1="0" y1="36" x2="1000" y2="36"/>
    <line x1="0" y1="216" x2="1000" y2="216"/>
    <line x1="0" y1="482" x2="1000" y2="482"/>
    <line x1="0" y1="636" x2="1000" y2="636"/>
    <line x1="0" y1="776" x2="1000" y2="776"/>
    <line x1="0" y1="906" x2="1000" y2="906"/>
    <line x1="120" y1="12" x2="120" y2="906"/>
    <line x1="640" y1="12" x2="640" y2="906"/>
  </g>

  <!-- Column headings -->
  <text x="136" y="28" class="colhead">Relationship lookup</text>
  <text x="330" y="28" class="sub">query: can Bob read Blob B?</text>
  <text x="656" y="28" class="colhead">Keying (where it applies)</text>

  <!-- Lane labels -->
  <text x="16" y="120" class="lane">Principals</text>
  <text x="16" y="138" class="lanesub">users · groups</text>
  <text x="16" y="336" class="lane">Containers</text>
  <text x="16" y="354" class="lanesub">manifests</text>
  <text x="16" y="369" class="lanesub">and grants</text>
  <text x="16" y="546" class="lane">Documents</text>
  <text x="16" y="564" class="lanesub">link-set</text>
  <text x="16" y="579" class="lanesub">manifests</text>
  <text x="16" y="700" class="lane">Updates</text>
  <text x="16" y="718" class="lanesub">Loro, encrypted</text>
  <text x="16" y="836" class="lane">Blobs</text>
  <text x="16" y="854" class="lanesub">attachments</text>

  <!-- ============ LOOKUP COLUMN ============ -->

  <!-- Principals -->
  <rect x="136" y="82" width="194" height="52" rx="4" class="box"/>
  <text x="148" y="102" class="name">Engineering</text>
  <text x="148" y="120" class="meta">group · signed group policy</text>

  <rect x="370" y="82" width="110" height="52" rx="4" class="box"/>
  <text x="382" y="102" class="name">Alice</text>
  <text x="382" y="120" class="meta">user</text>

  <rect x="510" y="82" width="110" height="52" rx="4" class="box"/>
  <text x="522" y="102" class="name">Bob</text>
  <text x="522" y="120" class="meta">user</text>

  <!-- group membership: Engineering includes Bob -->
  <path d="M233,82 V62 H565 V78" class="edge" marker-end="url(#access-keying-arrow)"/>
  <text x="245" y="56" class="elabel">includes (signed group policy)</text>
  <circle cx="505" cy="62" r="10" class="step"/><text x="505" y="66" class="stepnum">6</text>

  <!-- Containers -->
  <rect x="335" y="238" width="180" height="66" rx="4" class="box"/>
  <text x="347" y="258" class="name">C1 · org root</text>
  <text x="347" y="276" class="mono">grants · parent: none</text>
  <text x="347" y="294" class="key">KEK C1</text>

  <rect x="136" y="396" width="170" height="66" rx="4" class="box"/>
  <text x="148" y="416" class="name">C2 · Projects</text>
  <text x="148" y="434" class="mono">grants · parent: C1</text>
  <text x="148" y="452" class="key">KEK C2</text>

  <rect x="455" y="396" width="170" height="66" rx="4" class="box"/>
  <text x="467" y="416" class="name">C3 · Inbox</text>
  <text x="467" y="434" class="mono">grants · parent: C1</text>
  <text x="467" y="452" class="key">KEK C3</text>

  <!-- parent path (child -> parent) -->
  <path d="M270,396 V356 H600 V396" class="edge"/>
  <path d="M425,356 V308" class="edge" marker-end="url(#access-keying-arrow)"/>
  <text x="435" y="349" class="elabel">parent (to root)</text>
  <circle cx="330" cy="356" r="10" class="step"/><text x="330" y="360" class="stepnum">4</text>

  <!-- grants (container -> principal) -->
  <path d="M233,396 V138" class="edge" marker-end="url(#access-keying-arrow)"/>
  <circle cx="233" cy="376" r="10" class="step"/><text x="233" y="380" class="stepnum">5</text>
  <text x="219" y="380" class="elabel" text-anchor="end">grant · read</text>

  <path d="M425,238 V138" class="edge" marker-end="url(#access-keying-arrow)"/>
  <circle cx="425" cy="178" r="10" class="step"/><text x="425" y="182" class="stepnum">5</text>
  <text x="441" y="182" class="elabel">grant · admin</text>

  <path d="M565,396 V138" class="edge" marker-end="url(#access-keying-arrow)"/>
  <circle cx="565" cy="376" r="10" class="step"/><text x="565" y="380" class="stepnum">5</text>
  <text x="549" y="380" class="elabel" text-anchor="end">grant · write</text>

  <!-- Documents -->
  <rect x="305" y="516" width="240" height="76" rx="4" class="box"/>
  <text x="317" y="536" class="name">Doc D · link-set manifest</text>
  <text x="317" y="554" class="mono">linkedContainerIds: [C2, C3]</text>
  <text x="317" y="574" class="key">content key</text>

  <!-- document links (doc -> containers) -->
  <path d="M365,516 V498 H250 V466" class="edge" marker-end="url(#access-keying-arrow)"/>
  <path d="M485,516 V498 H540 V466" class="edge" marker-end="url(#access-keying-arrow)"/>
  <circle cx="330" cy="498" r="10" class="step"/><text x="330" y="502" class="stepnum">3</text>
  <circle cx="512" cy="498" r="10" class="step"/><text x="512" y="502" class="stepnum">3</text>
  <text x="258" y="493" class="elabel">linked</text>
  <text x="548" y="493" class="elabel">linked</text>

  <!-- Updates -->
  <rect x="176" y="680" width="146" height="80" rx="4" class="box"/>
  <text x="186" y="700" class="name">Loro update u1</text>
  <text x="186" y="717" class="mono">vv span</text>
  <text x="186" y="732" class="mono">ciphertext</text>
  <text x="186" y="750" class="key">signed write header</text>

  <rect x="330" y="680" width="146" height="80" rx="4" class="box"/>
  <text x="340" y="700" class="name">Loro update u2</text>
  <text x="340" y="717" class="mono">vv span</text>
  <text x="340" y="732" class="mono">ciphertext</text>
  <text x="340" y="750" class="key">signed write header</text>

  <rect x="484" y="680" width="146" height="80" rx="4" class="box"/>
  <text x="494" y="700" class="name">Loro update u3</text>
  <text x="494" y="717" class="mono">vv span</text>
  <text x="494" y="732" class="mono">ciphertext</text>
  <text x="494" y="750" class="key">signed write header</text>

  <path d="M249,680 V664 H557 V680" class="edge"/>
  <path d="M403,680 V596" class="edge" marker-end="url(#access-keying-arrow)"/>
  <text x="413" y="652" class="elabel">update of</text>

  <!-- Blobs -->
  <rect x="180" y="806" width="180" height="80" rx="4" class="box"/>
  <text x="192" y="826" class="name">Attachment binding</text>
  <text x="192" y="843" class="mono">slotId</text>
  <text x="192" y="858" class="mono">signed bind event</text>
  <text x="192" y="876" class="meta">active = authority</text>

  <rect x="460" y="806" width="170" height="80" rx="4" class="box"/>
  <text x="472" y="826" class="name">Blob B</text>
  <text x="472" y="843" class="mono">encrypted bytes</text>
  <text x="472" y="858" class="mono">(S3/R2)</text>
  <text x="472" y="876" class="key">blob content key</text>

  <path d="M460,841 H364" class="edge" marker-end="url(#access-keying-arrow)"/>
  <circle cx="412" cy="841" r="10" class="step"/><text x="412" y="845" class="stepnum">1</text>
  <text x="412" y="825" class="elabel" text-anchor="middle">bound by</text>

  <path d="M180,846 H150 V566 H301" class="edge" marker-end="url(#access-keying-arrow)"/>
  <circle cx="150" cy="706" r="10" class="step"/><text x="150" y="710" class="stepnum">2</text>
  <text x="160" y="796" class="elabel">binds to</text>

  <!-- ============ KEYING COLUMN ============ -->

  <!-- Principals -->
  <rect x="656" y="50" width="304" height="66" rx="4" class="kbox"/>
  <text x="668" y="70" class="name">User key</text>
  <text x="668" y="88" class="meta">ML-KEM key pair; the private decapsulation</text>
  <text x="668" y="104" class="meta">key opens wraps</text>

  <rect x="656" y="148" width="304" height="62" rx="4" class="kbox"/>
  <text x="668" y="168" class="name">Group epoch key</text>
  <text x="668" y="186" class="meta">a member envelope wraps it to each</text>
  <text x="668" y="202" class="meta">member's user key</text>

  <path d="M686,116 V144" class="kedge" marker-end="url(#access-keying-arrow-key)"/>
  <text x="696" y="135" class="klabel">opens member envelope</text>

  <!-- Containers -->
  <rect x="656" y="252" width="304" height="134" rx="4" class="kbox"/>
  <text x="668" y="272" class="name">Container KEK (one per key epoch)</text>
  <text x="668" y="290" class="meta">wrapped to each direct grantee (user or</text>
  <text x="668" y="306" class="meta">group key) and to the parent KEK, so</text>
  <text x="668" y="322" class="meta">ancestor access flows down</text>
  <text x="668" y="342" class="keymono">KEK C1 → Alice</text>
  <text x="668" y="358" class="keymono">KEK C2 → Engineering, KEK C1</text>
  <text x="668" y="374" class="keymono">KEK C3 → Bob, KEK C1</text>

  <path d="M960,83 H974 V319 H964" class="kedge" marker-end="url(#access-keying-arrow-key)"/>
  <text x="986" y="201" class="klabel" text-anchor="middle" transform="rotate(90 986 201)">direct grant</text>
  <path d="M686,210 V248" class="kedge" marker-end="url(#access-keying-arrow-key)"/>
  <text x="696" y="234" class="klabel">opens KEK wrap (user or group recipient)</text>

  <!-- Documents -->
  <rect x="656" y="500" width="254" height="116" rx="4" class="kbox"/>
  <text x="668" y="520" class="name">Document content key</text>
  <text x="668" y="538" class="meta">one bundle per key epoch, wrapped</text>
  <text x="668" y="554" class="meta">to the current KEK of every linked</text>
  <text x="668" y="570" class="meta">container</text>
  <text x="668" y="590" class="keymono">→ KEK C2, KEK C3</text>
  <text x="668" y="606" class="keymono">documentKeyTargetHash</text>

  <path d="M686,386 V496" class="kedge" marker-end="url(#access-keying-arrow-key)"/>
  <text x="696" y="445" class="klabel">opens content-key bundle</text>

  <!-- Updates -->
  <rect x="656" y="660" width="254" height="84" rx="4" class="kbox"/>
  <text x="668" y="680" class="name">Update ciphertext</text>
  <text x="668" y="698" class="meta">AEAD under the document content</text>
  <text x="668" y="714" class="meta">key; the signed header commits the</text>
  <text x="668" y="730" class="meta">manifest hash and target hash</text>

  <path d="M686,616 V656" class="kedge" marker-end="url(#access-keying-arrow-key)"/>
  <text x="696" y="648" class="klabel">decrypts</text>

  <!-- Blobs -->
  <rect x="656" y="794" width="304" height="100" rx="4" class="kbox"/>
  <text x="668" y="814" class="name">Blob content key</text>
  <text x="668" y="832" class="meta">wrapped to the union of KEK targets of</text>
  <text x="668" y="848" class="meta">every bound doc; bytes are encrypted once</text>
  <text x="668" y="864" class="meta">and rewrapping needs no restage</text>
  <text x="668" y="882" class="keymono">→ KEK C2, KEK C3 (via Doc D)</text>

  <path d="M935,386 V790" class="kedge" marker-end="url(#access-keying-arrow-key)"/>
  <text x="948" y="588" class="klabel" text-anchor="middle" transform="rotate(90 948 588)">opens blob key (not via the doc key)</text>

  <!-- ============ FOOTER ============ -->
  <text x="16" y="938" class="foothead">Lookup steps (resource → authority)</text>
  <g class="foot">
    <circle cx="26" cy="959" r="10" class="step"/><text x="26" y="963" class="stepnum">1</text>
    <text x="46" y="964">Blob → its active signed attachment bindings</text>
    <circle cx="26" cy="983" r="10" class="step"/><text x="26" y="987" class="stepnum">2</text>
    <text x="46" y="988">Binding → document → its verified link-set manifest</text>
    <circle cx="26" cy="1007" r="10" class="step"/><text x="26" y="1011" class="stepnum">3</text>
    <text x="46" y="1012">Link-set → every linked container (C2, C3); the doc has no ACL of its own</text>
    <circle cx="26" cy="1031" r="10" class="step"/><text x="26" y="1035" class="stepnum">4</text>
    <text x="46" y="1036">Each linked container → verified manifest path to its root (C2→C1, C3→C1)</text>
    <circle cx="26" cy="1055" r="10" class="step"/><text x="26" y="1059" class="stepnum">5</text>
    <text x="46" y="1060">Collect direct grants along each path, additively: Alice·admin, Engineering·read, Bob·write</text>
    <circle cx="26" cy="1079" r="10" class="step"/><text x="26" y="1083" class="stepnum">6</text>
    <text x="46" y="1084">Expand groups via signed group policy (Engineering ∋ Bob). Read: any path grants read.</text>
    <text x="46" y="1104">Write: one write path is enough (Bob via C3), but every write encrypts to all linked containers' KEKs.</text>
  </g>

  <text x="16" y="1144" class="foothead">Legend</text>
  <path d="M16,1166 H64" class="edge" marker-end="url(#access-keying-arrow)"/>
  <text x="76" y="1170" class="foot">lookup edge (signed relationship)</text>
  <path d="M16,1192 H64" class="kedge" marker-end="url(#access-keying-arrow-key)"/>
  <text x="76" y="1196" class="foot">key unwrap (holder of upper key opens lower)</text>
  <text x="500" y="1170" class="key">KEK C1</text>
  <text x="560" y="1170" class="foot">key material held or applied at that object</text>
  <circle cx="510" cy="1192" r="10" class="step"/><text x="510" y="1196" class="stepnum">n</text>
  <text x="560" y="1196" class="foot">lookup step, in order</text>
  <text x="16" y="1228" class="meta">The server stores ciphertext, wrapped keys and manifests; clients re-verify every manifest before deciding or encrypting.</text>
</svg>

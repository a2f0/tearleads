<svg xmlns="http://www.w3.org/2000/svg" width="600" height="756" viewBox="0 0 600 756" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <title>Registration in one request</title>
  <desc>The device builds and signs the group and organization policies, the root container with a KEK wrapped to Admins, the root metadata document with a content key wrapped to that KEK, and the organization's metadata, profile, and system containers. One POST /auth/register commits all of it in a single transaction, and the device then pins the identity, persists the result, and signs in.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="arrowhead"/></marker>
    <marker id="key-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="arrowhead-key"/></marker>
    <style>
      .canvas,.box { fill: #fff; }
      .band { fill: #f8fafc; }
      .box,.edge { stroke: #4b5563; }
      .kedge { stroke: #b45309; stroke-dasharray: 5 3; }
      .box,.edge,.kedge { stroke-width: 1.25; }
      .edge,.kedge { fill: none; }
      .arrowhead { fill: #4b5563; }
      .arrowhead-key { fill: #b45309; }
      .colhead { font-size: 13px; font-weight: 600; letter-spacing: .04em; }
      .name { font-size: 15px; font-weight: 600; }
      .colhead,.name { fill: #111827; }
      .meta { fill: #4b5563; font-size: 13px; }
      .mono { fill: #374151; font-size: 13px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      @media (prefers-color-scheme: dark) {
        .canvas,.box { fill: #18181b; }
        .band { fill: #242427; }
        .colhead,.name { fill: #fafafa; }
        .meta,.arrowhead { fill: #d4d4d8; }
        .mono { fill: #e4e4e7; }
        .box,.edge { stroke: #d4d4d8; }
        .kedge { stroke: #fbbf24; }
        .arrowhead-key { fill: #fbbf24; }
      }
    </style>
  </defs>
  <rect width="600" height="756" class="canvas"/>
  <rect y="378" width="600" height="222" class="band"/>

  <text x="16" y="24" class="colhead">ON THE DEVICE, BEFORE THE REQUEST</text>
  <rect x="16" y="36" width="264" height="70" rx="4" class="box"/>
  <text x="28" y="57" class="name">Admins and Members</text>
  <text x="28" y="76" class="meta">Group policies; a member envelope</text>
  <text x="28" y="94" class="meta">wraps each group key to the user</text>
  <rect x="320" y="36" width="264" height="70" rx="4" class="box"/>
  <text x="332" y="57" class="name">Organization policy</text>
  <text x="332" y="76" class="meta">Binds both groups' IDs and initial</text>
  <text x="332" y="94" class="meta">heads; a member envelope for the user</text>

  <path d="M148 106 V144" class="kedge" marker-end="url(#key-arrow)"/>
  <text x="160" y="130" class="meta">Admins key wraps the first root KEK</text>
  <rect x="16" y="146" width="264" height="70" rx="4" class="box"/>
  <text x="28" y="167" class="name">Root container</text>
  <text x="28" y="186" class="meta">Signed create with its first KEK</text>
  <text x="28" y="204" class="meta">epoch, parent none</text>
  <path d="M280 181 H318" class="kedge" marker-end="url(#key-arrow)"/>
  <rect x="320" y="146" width="264" height="70" rx="4" class="box"/>
  <text x="332" y="167" class="name">Root metadata document</text>
  <text x="332" y="186" class="meta">Content key wrapped to the root</text>
  <text x="332" y="204" class="meta">KEK; first Loro update encrypted</text>

  <rect x="16" y="232" width="568" height="70" rx="4" class="box"/>
  <text x="28" y="253" class="name">Organization metadata, profile, and system containers</text>
  <text x="28" y="272" class="meta">Each with its signed manifest and encrypted documents, such as the roster</text>
  <text x="28" y="290" class="meta">profile and organization profile</text>

  <path d="M320 302 V410" class="edge" marker-end="url(#arrow)"/>
  <text x="334" y="328" class="mono">POST /auth/register</text>
  <text x="334" y="347" class="meta">all of the above, signed, with</text>
  <text x="334" y="365" class="meta">the accepted legal terms version</text>

  <text x="16" y="400" class="colhead">ON THE SERVER, ONE TRANSACTION</text>
  <rect x="16" y="412" width="376" height="126" rx="4" class="box"/>
  <text x="28" y="433" class="name">Commit everything or nothing</text>
  <text x="28" y="452" class="meta">Insert the organization, its billing row, the root</text>
  <text x="28" y="470" class="meta">container, the user, and the Admins and Members</text>
  <text x="28" y="488" class="meta">groups; store the policies and initial roster;</text>
  <text x="28" y="506" class="meta">verify and store each signed manifest, KEK state,</text>
  <text x="28" y="524" class="meta">metadata document, and encrypted update</text>
  <path d="M392 465 H410" class="edge" marker-end="url(#arrow)"/>
  <rect x="412" y="412" width="172" height="106" rx="4" class="box"/>
  <text x="424" y="433" class="name">Refusals</text>
  <text x="424" y="452" class="meta">Known fingerprint:</text>
  <text x="424" y="470" class="meta">roll back, 409</text>
  <text x="424" y="488" class="meta">Stale legal terms:</text>
  <text x="424" y="506" class="meta">409 before it starts</text>

  <path d="M320 538 V632" class="edge" marker-end="url(#arrow)"/>
  <text x="334" y="564" class="meta">created ids, epochs, committed</text>
  <text x="334" y="582" class="meta">update ids, and a challenge</text>

  <text x="16" y="622" class="colhead">ON THE DEVICE, AFTER THE RESPONSE</text>
  <rect x="16" y="634" width="376" height="106" rx="4" class="box"/>
  <text x="28" y="655" class="name">Finish locally</text>
  <text x="28" y="674" class="meta">1</text>
  <text x="44" y="674" class="meta">Pin the identity once userId is confirmed</text>
  <text x="28" y="692" class="meta">2</text>
  <text x="44" y="692" class="meta">Persist containers, documents, and policies</text>
  <text x="28" y="710" class="meta">3</text>
  <text x="44" y="710" class="meta">Set user, organization, and root in session</text>
  <text x="28" y="728" class="meta">4</text>
  <text x="44" y="728" class="meta">Authenticate with the challenge</text>

  <path d="M412 668 H448" class="kedge" marker-end="url(#key-arrow)"/>
  <text x="458" y="673" class="meta">key wrap</text>
  <path d="M412 698 H448" class="edge" marker-end="url(#arrow)"/>
  <text x="458" y="703" class="meta">request or step</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1462" viewBox="0 0 600 1462" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Tearleads infrastructure</title>
  <defs>
    <marker id="infrastructure-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
    <style>
      .sub { font-size: 13.5px; fill: #4b5563; }
      .colhead { font-size: 13px; font-weight: 600; fill: #111827; letter-spacing: 0.04em; text-transform: uppercase; }
      .lane { font-size: 15px; font-weight: 600; fill: #111827; }
      .lanesub { font-size: 12px; fill: #6b7280; }
      .box { fill: #ffffff; stroke: #4b5563; stroke-width: 1.25; }
      .kbox { fill: #ffffff; stroke: #b45309; stroke-width: 1.25; stroke-dasharray: 5 3; }
      .name { font-size: 14px; font-weight: 600; fill: #111827; }
      .meta { font-size: 12px; fill: #4b5563; }
      .mono { font-size: 12px; fill: #374151; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .edge { fill: none; stroke: #4b5563; stroke-width: 1.25; }
      .elabel { font-size: 12px; fill: #374151; }
      .foot { font-size: 13px; fill: #374151; }
      .foothead { font-size: 13px; font-weight: 600; fill: #111827; }
      .canvas { fill: #ffffff; }
      .band { fill: #f8fafc; }
      .rule { stroke: #d1d5db; stroke-width: 1; }
      .arrowhead { fill: #4b5563; }
    </style>
  </defs>

  <rect x="0" y="0" width="600" height="1462" class="canvas"/>

  <!-- Lane bands: each lane is named at its top left -->
  <rect x="0" y="36" width="600" height="170" class="band"/>
  <rect x="0" y="206" width="600" height="316" class="canvas"/>
  <rect x="0" y="522" width="600" height="182" class="band"/>
  <rect x="0" y="704" width="600" height="220" class="canvas"/>
  <rect x="0" y="924" width="600" height="256" class="band"/>
  <g class="rule">
    <line x1="0" y1="36" x2="600" y2="36"/>
    <line x1="0" y1="206" x2="600" y2="206"/>
    <line x1="0" y1="522" x2="600" y2="522"/>
    <line x1="0" y1="704" x2="600" y2="704"/>
    <line x1="0" y1="924" x2="600" y2="924"/>
    <line x1="0" y1="1180" x2="600" y2="1180"/>
  </g>

  <!-- Heading -->
  <text x="16" y="28" class="colhead">Production tier</text>
  <text x="160" y="28" class="sub">staging runs the same layout on -staging hostnames</text>

  <!-- Lane labels -->
  <text x="16" y="58" class="lane">Clients</text>
  <text x="16" y="76" class="lanesub">keys and plaintext stay on the device</text>
  <text x="16" y="228" class="lane">Cloudflare</text>
  <text x="16" y="246" class="lanesub">Workers and</text>
  <text x="16" y="261" class="lanesub">Durable Objects</text>
  <text x="16" y="544" class="lane">Storage</text>
  <text x="16" y="562" class="lanesub">Cloudflare R2</text>
  <text x="16" y="577" class="lanesub">and PlanetScale</text>
  <text x="16" y="726" class="lane">Services</text>
  <text x="16" y="744" class="lanesub">third parties</text>
  <text x="16" y="946" class="lane">Operations</text>
  <text x="16" y="964" class="lanesub">deploy and CI</text>

  <!-- ============ CLIENTS ============ -->
  <rect x="16" y="88" width="172" height="80" rx="4" class="box"/>
  <text x="28" y="108" class="name">Web app</text>
  <text x="28" y="126" class="meta">in the browser at</text>
  <text x="28" y="142" class="mono">app.tearleads.com</text>
  <text x="28" y="158" class="mono">demo.tearleads.com</text>

  <rect x="200" y="88" width="172" height="80" rx="4" class="box"/>
  <text x="212" y="108" class="name">iOS and Android</text>
  <text x="212" y="126" class="meta">Capacitor shell,</text>
  <text x="212" y="142" class="meta">installed from the App</text>
  <text x="212" y="158" class="meta">Store and Google Play</text>

  <rect x="384" y="88" width="200" height="80" rx="4" class="box"/>
  <text x="396" y="108" class="name">Desktop</text>
  <text x="396" y="126" class="meta">Electrobun shell,</text>
  <text x="396" y="142" class="meta">installed from</text>
  <text x="396" y="158" class="mono">downloads.tearleads.com</text>

  <!-- Web app loads its bundle from the static Workers -->
  <path d="M140,168 V268" class="edge" marker-end="url(#infrastructure-arrow)"/>
  <text x="150" y="252" class="elabel">static assets</text>

  <!-- Every client reaches the API, and blob storage through presigned URLs -->
  <path d="M176,168 V188 H568 V588" class="edge" marker-end="url(#infrastructure-arrow)"/>
  <path d="M290,168 V268" class="edge" marker-end="url(#infrastructure-arrow)"/>
  <path d="M484,168 V188" class="edge"/>
  <text x="300" y="182" class="elabel">HTTPS and WebSocket</text>
  <text x="580" y="390" class="elabel" text-anchor="middle" transform="rotate(90 580 390)">presigned URLs: encrypted blob bytes</text>

  <!-- ============ CLOUDFLARE ============ -->
  <rect x="16" y="272" width="190" height="100" rx="4" class="box"/>
  <text x="28" y="292" class="name">Static asset Workers</text>
  <text x="28" y="310" class="mono">tearleads.com</text>
  <text x="28" y="326" class="mono">app.tearleads.com</text>
  <text x="28" y="342" class="mono">demo.tearleads.com</text>
  <text x="28" y="360" class="meta">no server runtime</text>

  <rect x="218" y="272" width="180" height="120" rx="4" class="box"/>
  <text x="230" y="292" class="name">API Worker</text>
  <text x="230" y="310" class="mono">api.tearleads.com</text>
  <text x="230" y="328" class="meta">Hono routes and /events</text>
  <text x="230" y="344" class="meta">cron: billing every minute,</text>
  <text x="230" y="360" class="meta">blob cleanup hourly</text>
  <text x="230" y="378" class="meta">placed in us-east-1</text>

  <rect x="16" y="388" width="156" height="118" rx="4" class="box"/>
  <text x="28" y="408" class="name">Durable Objects</text>
  <text x="28" y="426" class="mono">KeyValueStore</text>
  <text x="28" y="442" class="meta">sessions and tickets</text>
  <text x="28" y="462" class="mono">RealtimeHub</text>
  <text x="28" y="478" class="meta">every WebSocket</text>
  <text x="28" y="494" class="meta">SQLite storage</text>

  <path d="M232,392 V447 H176" class="edge" marker-end="url(#infrastructure-arrow)"/>
  <text x="204" y="441" class="elabel" text-anchor="middle">binding</text>

  <!-- API to Postgres through Hyperdrive -->
  <path d="M290,392 V588" class="edge" marker-end="url(#infrastructure-arrow)"/>
  <text x="300" y="416" class="elabel">Hyperdrive</text>
  <text x="300" y="432" class="elabel">pooled, TLS</text>

  <!-- API to R2 through the S3 API -->
  <path d="M398,380 H460 V588" class="edge" marker-end="url(#infrastructure-arrow)"/>
  <text x="450" y="480" class="elabel" text-anchor="end">S3 API: presign, delete</text>

  <!-- ============ STORAGE ============ -->
  <rect x="16" y="592" width="190" height="84" rx="4" class="box"/>
  <text x="28" y="612" class="name">R2 downloads bucket</text>
  <text x="28" y="630" class="mono">downloads.tearleads.com</text>
  <text x="28" y="646" class="meta">desktop installers and</text>
  <text x="28" y="662" class="meta">update files</text>

  <rect x="218" y="592" width="174" height="96" rx="4" class="box"/>
  <text x="230" y="612" class="name">PlanetScale Postgres</text>
  <text x="230" y="630" class="meta">us-east-1: accounts,</text>
  <text x="230" y="646" class="meta">signed records, encrypted</text>
  <text x="230" y="662" class="meta">updates, wrapped keys,</text>
  <text x="230" y="678" class="meta">billing state</text>

  <rect x="404" y="592" width="180" height="84" rx="4" class="box"/>
  <text x="416" y="612" class="name">R2 blob bucket</text>
  <text x="416" y="630" class="mono">tearleads-blobs-prod</text>
  <text x="416" y="646" class="meta">encrypted attachment bytes</text>
  <text x="416" y="662" class="meta">S3 API, presigned URLs</text>

  <!-- ============ SERVICES ============ -->
  <rect x="16" y="760" width="276" height="68" rx="4" class="kbox"/>
  <text x="28" y="780" class="name">Stripe</text>
  <text x="28" y="798" class="meta">web checkout and the billing portal;</text>
  <text x="28" y="814" class="meta">webhooks to the API</text>

  <rect x="308" y="760" width="276" height="68" rx="4" class="kbox"/>
  <text x="320" y="780" class="name">RevenueCat</text>
  <text x="320" y="798" class="meta">App Store and Google Play purchases,</text>
  <text x="320" y="814" class="meta">sync entitlement; webhooks to the API</text>

  <rect x="16" y="840" width="276" height="68" rx="4" class="kbox"/>
  <text x="28" y="860" class="name">Sentry</text>
  <text x="28" y="878" class="meta">error reports from the</text>
  <text x="28" y="894" class="meta">apps and the API</text>

  <rect x="308" y="840" width="276" height="68" rx="4" class="kbox"/>
  <text x="320" y="860" class="name">Healthchecks</text>
  <text x="320" y="878" class="meta">pings around each hourly</text>
  <text x="320" y="894" class="meta">blob cleanup run</text>

  <!-- ============ OPERATIONS ============ -->
  <rect x="16" y="980" width="276" height="86" rx="4" class="box"/>
  <text x="28" y="1000" class="name">Deploy scripts</text>
  <text x="28" y="1018" class="mono">scripts/deploy</text>
  <text x="28" y="1034" class="meta">Wrangler publishes the Workers;</text>
  <text x="28" y="1050" class="meta">Terraform applies each stack</text>

  <rect x="308" y="980" width="276" height="86" rx="4" class="box"/>
  <text x="320" y="1000" class="name">Terraform state</text>
  <text x="320" y="1018" class="mono">tearleads-terraform-state</text>
  <text x="320" y="1034" class="meta">R2, one state per tier and stack</text>

  <rect x="16" y="1078" width="276" height="86" rx="4" class="box"/>
  <text x="28" y="1098" class="name">GitHub Actions</text>
  <text x="28" y="1116" class="meta">checks every pull request;</text>
  <text x="28" y="1132" class="meta">publishes the client SDK and</text>
  <text x="28" y="1148" class="meta">windowing packages to npm</text>

  <!-- ============ FOOTER ============ -->
  <text x="16" y="1212" class="foothead">Notes</text>
  <g class="foot">
    <text x="16" y="1236">Workers, Durable Objects, Postgres, and R2 hold ciphertext, wrapped keys, signed</text>
    <text x="16" y="1254">records, and service-visible metadata.</text>
    <text x="16" y="1278">Blob bytes move between clients and R2 directly; the API signs short-lived upload</text>
    <text x="16" y="1296">and download URLs instead of relaying them.</text>
    <text x="16" y="1320">Terraform owns the buckets, Postgres, Hyperdrive, and custom domains; Wrangler</text>
    <text x="16" y="1338">owns the Workers and their assets.</text>
  </g>

  <text x="16" y="1378" class="foothead">Legend</text>
  <rect x="16" y="1392" width="44" height="20" rx="3" class="box"/>
  <text x="72" y="1406" class="foot">run in Tearleads' Cloudflare and PlanetScale accounts</text>
  <rect x="16" y="1424" width="44" height="20" rx="3" class="kbox"/>
  <text x="72" y="1438" class="foot">third-party service</text>
  <path d="M260,1434 H308" class="edge" marker-end="url(#infrastructure-arrow)"/>
  <text x="320" y="1438" class="foot">request direction</text>
</svg>

SPECIFICATION Spec

CONSTANTS
  MaxUpdate = 3
  MaxEpoch = 2
  MaxPage = 2
  RequireCurrentGeneration = TRUE
  RequireWinningInstall = TRUE
  RetireCheckpoints = TRUE
  FenceBlockedWriters = TRUE
  FinishVerifiedRecovery = TRUE
  ExcludeVoids = TRUE
  RebuildServedCheckpoints = TRUE
  RebuildOnlyServedCheckpoints = TRUE
  RequireSettledVerdicts = TRUE

INVARIANT TypeOK
INVARIANT NoDurableMutationBeforeComplete
INVARIANT FailedRecoveryPreservesDurableHistory
INVARIANT CompleteRecoveryContainsAppliedHistory
INVARIANT CompleteRecoveryRetiresQueuedCheckpoints
INVARIANT ScratchNeverLaundersCheckpoints
INVARIANT ScratchNeverHoldsVoids
INVARIANT RecoveryFailsOnlyForCause
INVARIANT RawCollectionStartsAfterLocalSettlement
INVARIANT SettlementUsesVerifiedOrdinaryProvenance
INVARIANT PreliminaryValidationPrecedesSettlement
INVARIANT PublicationRequiresExactHistoryProvenance
INVARIANT UnverifiedLocalHistoryNeverPublishes
INVARIANT SupersededInstallNeverPublishes
INVARIANT ChangedGenerationNeverPublishes
INVARIANT BlockedWriterCannotCrossRecoveryFence
INVARIANT UnavailableEpochReportIsDeterministic
INVARIANT InvalidPageNeverReportsAvailabilityFailure
